<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <clipPath id="c"><rect width="480" height="300" rx="14"/></clipPath>
    <filter id="clay" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#6366F1" flood-opacity="0.22"/>
    </filter>
    <filter id="clayPink" x="-15%" y="-15%" width="130%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#EC4899" flood-opacity="0.25"/>
    </filter>
  </defs>
  <g clip-path="url(#c)">
    <rect width="480" height="300" fill="#EEF2FF"/>
    <!-- soft background blobs -->
    <circle cx="420" cy="40" r="65" fill="#FDE68A" opacity="0.5"/>
    <circle cx="50" cy="260" r="70" fill="#FBCFE8" opacity="0.5"/>
    <!-- header clay pill -->
    <rect x="20" y="14" width="440" height="36" rx="18" fill="#FFFFFF" filter="url(#clay)"/>
    <text x="38" y="37" font-size="13" font-weight="800" fill="#4F46E5">LUMEN 3D</text>
    <g font-size="10" font-weight="600" fill="#6366F1">
      <text x="290" y="36">任務</text><text x="330" y="36">獎勵</text>
    </g>
    <rect x="374" y="20" width="76" height="24" rx="12" fill="#F472B6" stroke="#FBCFE8" stroke-width="2" filter="url(#clayPink)"/>
    <text x="412" y="36" font-size="10" font-weight="700" fill="#FFFFFF" text-anchor="middle">開始存錢</text>
    <!-- hero -->
    <text x="32" y="98" font-size="30" font-weight="900" fill="#312E81">好好過日子</text>
    <text x="32" y="122" font-size="12" font-weight="600" fill="#6366F1">像軟糖一樣蓬鬆立體的 3D 互動體驗</text>
    <!-- clay primary button -->
    <rect x="32" y="138" width="124" height="36" rx="18" fill="#6366F1" stroke="#A5B4FC" stroke-width="3" filter="url(#clay)"/>
    <text x="94" y="161" font-size="12" font-weight="800" fill="#FFFFFF" text-anchor="middle">立即體驗 ✨</text>
    <!-- right clay badge -->
    <rect x="348" y="68" width="104" height="104" rx="28" fill="#A7F3D0" stroke="#FFFFFF" stroke-width="4" filter="url(#clay)"/>
    <circle cx="400" cy="108" r="22" fill="#34D399" stroke="#D1FAE5" stroke-width="3"/>
    <text x="400" y="114" font-size="16" text-anchor="middle" fill="#FFFFFF">★</text>
    <text x="400" y="152" font-size="11" font-weight="800" fill="#065F46" text-anchor="middle">+120 PT</text>
    <!-- 3 clay cards -->
    <g filter="url(#clay)">
      <rect x="24" y="196" width="136" height="84" rx="22" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="172" y="196" width="136" height="84" rx="22" fill="#FEF3C7" stroke="#FFFFFF" stroke-width="3"/>
      <rect x="320" y="196" width="136" height="84" rx="22" fill="#FCE7F3" stroke="#FFFFFF" stroke-width="3"/>
    </g>
    <g font-size="12" font-weight="800" fill="#312E81">
      <text x="40" y="226">生活小目標</text>
      <text x="188" y="226" fill="#92400E">立體器物</text>
      <text x="336" y="226" fill="#9D174D">蓬鬆空間</text>
    </g>
    <g font-size="10" fill="#6B7280">
      <text x="40" y="248">大圓角＋高光白邊</text>
      <text x="188" y="248">雙層柔和立體陰影</text>
      <text x="336" y="248">粉彩馬卡龍配色</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="479" height="299" rx="14" fill="none" stroke="#C7D2FE"/>
</svg>
