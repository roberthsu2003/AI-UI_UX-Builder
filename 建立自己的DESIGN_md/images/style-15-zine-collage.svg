<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" width="480" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs><clipPath id="c"><rect width="480" height="300" rx="14"/></clipPath></defs>
  <g clip-path="url(#c)">
    <rect width="480" height="300" fill="#FBF5E9"/>
    <!-- kraft paper dot pattern -->
    <circle cx="40" cy="40" r="2" fill="#D97706" opacity="0.25"/>
    <circle cx="120" cy="70" r="2" fill="#D97706" opacity="0.25"/>
    <circle cx="440" cy="140" r="2" fill="#D97706" opacity="0.25"/>
    <!-- header -->
    <text x="30" y="36" font-size="14" font-weight="800" fill="#292524">LUMEN 小誌</text>
    <path d="M28 42 Q 70 46, 114 40" fill="none" stroke="#EA580C" stroke-width="2.5" stroke-linecap="round"/>
    <g font-size="11" font-weight="700" fill="#57534E">
      <text x="310" y="36">市集</text><text x="356" y="36">攤位</text><text x="402" y="36">地圖</text>
    </g>
    <!-- highlighter behind hero title -->
    <rect x="26" y="88" width="192" height="24" fill="#FDE047" transform="rotate(-1 122 100)"/>
    <text x="30" y="108" font-size="32" font-weight="900" fill="#1C1917">好好過日子</text>
    <text x="30" y="134" font-size="11" fill="#57534E">手繪塗鴉線條、剪貼紙張與紙膠帶拼貼</text>
    <!-- hand-drawn button -->
    <rect x="30" y="148" width="118" height="32" rx="8" fill="#FB923C" stroke="#1C1917" stroke-width="2" transform="rotate(-1.5 89 164)"/>
    <text x="89" y="168" font-size="12" font-weight="800" fill="#1C1917" text-anchor="middle" transform="rotate(-1.5 89 164)">去逛逛小誌 ✎</text>
    <!-- doodle star -->
    <path d="M404 72 L412 88 L430 90 L416 102 L420 120 L404 111 L388 120 L392 102 L378 90 L396 88 Z" fill="#FDE047" stroke="#1C1917" stroke-width="2" stroke-linejoin="round"/>
    <!-- 3 collage cards with masking tape -->
    <g transform="rotate(-2 92 238)">
      <rect x="28" y="200" width="128" height="78" fill="#FFFFFF" stroke="#1C1917" stroke-width="2"/>
      <rect x="68" y="191" width="48" height="14" fill="#93C5FD" opacity="0.85"/>
      <text x="42" y="228" font-size="12" font-weight="800" fill="#1C1917">生活剪貼</text>
      <text x="42" y="250" font-size="10" fill="#57534E">不對稱旋轉紙片</text>
    </g>
    <g transform="rotate(1.5 240 238)">
      <rect x="176" y="200" width="128" height="78" fill="#FEF3C7" stroke="#1C1917" stroke-width="2"/>
      <rect x="216" y="191" width="48" height="14" fill="#FDA4AF" opacity="0.85"/>
      <text x="190" y="228" font-size="12" font-weight="800" fill="#1C1917">手繪器物</text>
      <text x="190" y="250" font-size="10" fill="#57534E">螢光筆與紙膠帶</text>
    </g>
    <g transform="rotate(-1.5 388 238)">
      <rect x="324" y="200" width="128" height="78" fill="#ECFDF5" stroke="#1C1917" stroke-width="2"/>
      <rect x="364" y="191" width="48" height="14" fill="#FDE047" opacity="0.85"/>
      <text x="338" y="228" font-size="12" font-weight="800" fill="#1C1917">手作空間</text>
      <text x="338" y="250" font-size="10" fill="#57534E">滿滿人類創作感</text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="479" height="299" rx="14" fill="none" stroke="#D6D3D1"/>
</svg>
