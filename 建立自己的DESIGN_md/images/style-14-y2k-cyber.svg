<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" font-family="'PingFang TC','Noto Sans TC',sans-serif">
  <defs>
    <clipPath id="c"><rect width="480" height="300" rx="14"/></clipPath>
    <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#94A3B8"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
  </defs>
  <g clip-path="url(#c)">
    <rect width="480" height="300" fill="#0B0719"/>
    <!-- perspective retro grid -->
    <path d="M0 220 H480 M0 245 H480 M0 272 H480 M60 220 L0 300 M150 220 L110 300 M240 220 V300 M330 220 L370 300 M420 220 L480 300" stroke="#7E22CE" stroke-width="1" opacity="0.6"/>
    <!-- Y2K window bar -->
    <rect x="18" y="14" width="444" height="28" fill="url(#chrome)" stroke="#CCFF00" stroke-width="2"/>
    <text x="30" y="33" font-size="11" font-weight="900" fill="#0B0719" font-family="monospace">LUMEN_2000.EXE</text>
    <rect x="414" y="20" width="16" height="16" fill="#FF00AA" stroke="#0B0719" stroke-width="1.5"/>
    <rect x="436" y="20" width="16" height="16" fill="#CCFF00" stroke="#0B0719" stroke-width="1.5"/>
    <!-- acid sticker -->
    <polygon points="370,56 456,64 446,104 360,96" fill="#CCFF00" stroke="#FFFFFF" stroke-width="1.5"/>
    <text x="408" y="86" font-size="12" font-weight="900" fill="#0B0719" text-anchor="middle" transform="rotate(5 408 82)">CYBER 2K</text>
    <!-- hero -->
    <text x="28" y="102" font-size="34" font-weight="900" fill="#CCFF00" letter-spacing="2">好好過日子</text>
    <text x="28" y="126" font-size="11" font-weight="700" fill="#E879F9">ACID GREEN · CHROME SILVER · PIXEL RETRO</text>
    <!-- CTA -->
    <rect x="28" y="142" width="132" height="32" fill="#FF00AA" stroke="#FFFFFF" stroke-width="2"/>
    <text x="94" y="162" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle">ENTER PARTY &gt;&gt;</text>
    <!-- 3 Y2K cards -->
    <rect x="24" y="196" width="136" height="82" fill="#17102E" stroke="#CCFF00" stroke-width="2"/>
    <rect x="172" y="196" width="136" height="82" fill="#17102E" stroke="#FF00AA" stroke-width="2"/>
    <rect x="320" y="196" width="136" height="82" fill="#17102E" stroke="#38BDF8" stroke-width="2"/>
    <text x="36" y="222" font-size="12" font-weight="900" fill="#CCFF00">01 // 生活</text>
    <text x="184" y="222" font-size="12" font-weight="900" fill="#FF00AA">02 // 器物</text>
    <text x="332" y="222" font-size="12" font-weight="900" fill="#38BDF8">03 // 空間</text>
    <text x="36" y="246" font-size="10" fill="#E2E8F0">螢光酸綠撞電光粉</text>
    <text x="184" y="246" font-size="10" fill="#E2E8F0">金屬鉻銀視窗邊框</text>
    <text x="332" y="246" font-size="10" fill="#E2E8F0">千禧數位貼紙感</text>
  </g>
  <rect x="0.5" y="0.5" width="479" height="299" rx="14" fill="none" stroke="#CCFF00"/>
</svg>
