<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="800" height="500" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">風格地圖：16 種設計風格分布在「理性／感性 × 安靜／熱鬧」四象限</text>

  <!-- quadrants -->
  <rect x="60" y="68" width="340" height="186" fill="#F8FAFC"/>
  <rect x="400" y="68" width="340" height="186" fill="#FFF7ED"/>
  <rect x="60" y="254" width="340" height="186" fill="#F0F9FF"/>
  <rect x="400" y="254" width="340" height="186" fill="#FDF2F8"/>
  <path d="M60 254 H740" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <path d="M400 68 V440" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <g font-size="12" font-weight="700" fill="#6B7280">
    <text x="68" y="246">理性・講求效率</text>
    <text x="732" y="246" text-anchor="end">感性・講求氛圍</text>
    <text x="408" y="84">安靜・克制</text>
    <text x="408" y="434">熱鬧・大膽</text>
  </g>

  <!-- Quadrant 1: 理性 × 安靜 (左上) -->
  <g font-size="12" font-weight="700">
    <rect x="86" y="92" width="110" height="28" rx="14" fill="#FFFFFF" stroke="#111827"/><text x="141" y="111" text-anchor="middle" fill="#111827">① 極簡風</text>
    <rect x="224" y="92" width="136" height="28" rx="4" fill="#E5E7EB" stroke="#374151"/><text x="292" y="111" text-anchor="middle" fill="#111827">⑪ 工業技術風</text>
    <rect x="86" y="144" width="128" height="28" rx="0" fill="#FFFFFF" stroke="#E5322D"/><text x="150" y="163" text-anchor="middle" fill="#E5322D">⑥ 瑞士格線風</text>
    <rect x="224" y="182" width="136" height="28" rx="14" fill="#FFFFFF" stroke="#1B5E3A"/><text x="292" y="201" text-anchor="middle" fill="#1B5E3A">⑩ 公共服務風</text>
  </g>

  <!-- Quadrant 2: 感性 × 安靜 (右上) -->
  <g font-size="12" font-weight="700">
    <rect x="428" y="92" width="130" height="28" rx="14" fill="#FFFFFF" stroke="#8B5E3C"/><text x="493" y="111" text-anchor="middle" fill="#8B5E3C">② 編輯雜誌風</text>
    <rect x="578" y="92" width="126" height="28" rx="14" fill="#0D0C0A"/><text x="641" y="111" text-anchor="middle" fill="#C9A962">⑨ 暗黑奢華風</text>
    <rect x="436" y="148" width="144" height="28" rx="4" fill="#F4EAD5" stroke="#B8332A"/><text x="508" y="167" text-anchor="middle" fill="#B8332A">⑫ 復古懷舊紙本風</text>
    <rect x="572" y="190" width="134" height="28" rx="14" fill="#FFFFFF" stroke="#5B7B6D"/><text x="639" y="209" text-anchor="middle" fill="#5B7B6D">⑧ 柔和療癒風</text>
  </g>

  <!-- Quadrant 3: 理性 × 熱鬧 (左下) -->
  <g font-size="12" font-weight="700">
    <rect x="86" y="280" width="126" height="28" rx="14" fill="#FFFFFF" stroke="#2563EB"/><text x="149" y="299" text-anchor="middle" fill="#2563EB">③ 現代 SaaS 風</text>
    <rect x="234" y="280" width="130" height="28" rx="14" fill="#F3F4F6" stroke="#111827"/><text x="299" y="299" text-anchor="middle" fill="#111827">④ 便當盒格狀</text>
    <rect x="86" y="340" width="128" height="28" rx="14" fill="#1E1B4B"/><text x="150" y="359" text-anchor="middle" fill="#FFFFFF">⑦ 玻璃擬態</text>
    <rect x="228" y="368" width="144" height="28" rx="14" fill="#FCE7F3" stroke="#EC4899"/><text x="300" y="387" text-anchor="middle" fill="#BE185D">⑬ 3D 黏土軟膠風</text>
  </g>

  <!-- Quadrant 4: 感性 × 熱鬧 (右下) -->
  <g font-size="12" font-weight="700">
    <rect x="432" y="280" width="136" height="28" rx="0" fill="#FDE047" stroke="#000000" stroke-width="2"/><text x="500" y="299" text-anchor="middle" fill="#000000">⑤ 新粗野主義</text>
    <rect x="582" y="280" width="142" height="28" rx="4" fill="#0B0719" stroke="#CCFF00" stroke-width="1.5"/><text x="653" y="299" text-anchor="middle" fill="#CCFF00">⑭ Y2K 千禧潮流</text>
    <rect x="432" y="346" width="142" height="28" rx="6" fill="#FEF3C7" stroke="#D97706" stroke-dasharray="4 2"/><text x="503" y="365" text-anchor="middle" fill="#92400E">⑮ 手繪拼貼雜誌</text>
    <rect x="578" y="378" width="148" height="28" rx="14" fill="#1E1B4B" stroke="#818CF8"/><text x="652" y="397" text-anchor="middle" fill="#E0E7FF">⑯ 沉浸式光影敘事</text>
  </g>

  <g font-size="11" fill="#6B7280">
    <text x="68" y="472">左上（理性×安靜）：架構、規範、工具　右上（感性×安靜）：品牌、工藝、奢華　左下（理性×熱鬧）：SaaS、儀表板、App　右下（感性×熱鬧）：策展、潮流、活動</text>
  </g>
</svg>
