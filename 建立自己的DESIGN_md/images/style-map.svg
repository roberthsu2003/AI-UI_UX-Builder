<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="800" height="460" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="800" height="460" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">風格地圖：先決定「理性或感性」、「安靜或熱鬧」</text>

  <!-- quadrants -->
  <rect x="80" y="70" width="320" height="170" fill="#F8FAFC"/>
  <rect x="400" y="70" width="320" height="170" fill="#FFF7ED"/>
  <rect x="80" y="240" width="320" height="170" fill="#F0F9FF"/>
  <rect x="400" y="240" width="320" height="170" fill="#FDF2F8"/>
  <path d="M80 240 H720" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <path d="M400 70 V410" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <g font-size="13" font-weight="700" fill="#6B7280">
    <text x="88" y="232">理性・講求效率</text>
    <text x="712" y="232" text-anchor="end">感性・講求氛圍</text>
    <text x="408" y="86">安靜・克制</text>
    <text x="408" y="404">熱鬧・大膽</text>
  </g>

  <!-- styles -->
  <g font-size="13" font-weight="700">
    <rect x="110" y="100" width="98" height="30" rx="15" fill="#FFFFFF" stroke="#111827"/><text x="159" y="120" text-anchor="middle" fill="#111827">① 極簡風</text>
    <rect x="230" y="150" width="128" height="30" rx="15" fill="#FFFFFF" stroke="#1B5E3A"/><text x="294" y="170" text-anchor="middle" fill="#1B5E3A">⑩ 公共服務風</text>
    <rect x="120" y="190" width="120" height="30" rx="15" fill="#FFFFFF" stroke="#2563EB"/><text x="180" y="210" text-anchor="middle" fill="#2563EB">③ 現代 SaaS</text>

    <rect x="440" y="100" width="128" height="30" rx="15" fill="#FFFFFF" stroke="#8B5E3C"/><text x="504" y="120" text-anchor="middle" fill="#8B5E3C">② 編輯雜誌風</text>
    <rect x="590" y="130" width="112" height="30" rx="15" fill="#0D0C0A"/><text x="646" y="150" text-anchor="middle" fill="#C9A962">⑨ 暗黑奢華</text>
    <rect x="470" y="180" width="128" height="30" rx="15" fill="#FFFFFF" stroke="#5B7B6D"/><text x="534" y="200" text-anchor="middle" fill="#5B7B6D">⑧ 柔和療癒風</text>

    <rect x="110" y="280" width="128" height="30" rx="15" fill="#FFFFFF" stroke="#E5322D"/><text x="174" y="300" text-anchor="middle" fill="#E5322D">⑥ 瑞士格線風</text>
    <rect x="240" y="330" width="128" height="30" rx="15" fill="#F3F4F6" stroke="#111827"/><text x="304" y="350" text-anchor="middle" fill="#111827">④ 便當盒格狀</text>

    <rect x="450" y="290" width="132" height="30" rx="15" fill="#1E1B4B"/><text x="516" y="310" text-anchor="middle" fill="#FFFFFF">⑦ 玻璃擬態</text>
    <rect x="560" y="350" width="140" height="30" rx="0" fill="#FDE047" stroke="#000000" stroke-width="2"/><text x="630" y="370" text-anchor="middle" fill="#000000">⑤ 新粗野主義</text>
  </g>

  <g font-size="11" fill="#6B7280">
    <text x="88" y="434">左上：政府、醫療、工具類　　右上：咖啡館、選品、精品、身心健康　　左下：設計展、科技產品　　右下：活動、潮流、年輕品牌</text>
  </g>
</svg>
