<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#9CA3AF"/>
    </marker>
  </defs>
  <rect width="800" height="520" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="400" y="38" text-anchor="middle" font-size="21" font-weight="800" fill="#111827">風格地圖：16 種設計風格分佈（理性／感性 × 安靜／熱鬧）</text>

  <!-- quadrants -->
  <rect x="24" y="60" width="376" height="206" fill="#F8FAFC"/>
  <rect x="400" y="60" width="376" height="206" fill="#FFF7ED"/>
  <rect x="24" y="266" width="376" height="206" fill="#F0F9FF"/>
  <rect x="400" y="266" width="376" height="206" fill="#FDF2F8"/>
  <path d="M24 266 H776" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>
  <path d="M400 60 V472" stroke="#9CA3AF" stroke-width="2" marker-start="url(#m)" marker-end="url(#m)"/>

  <!-- axis labels -->
  <g font-size="13" font-weight="700" fill="#6B7280">
    <text x="36" y="256">理性・講求效率</text>
    <text x="764" y="256" text-anchor="end">感性・講求氛圍</text>
    <text x="410" y="78">安靜・克制</text>
    <text x="410" y="462">熱鬧・大膽</text>
  </g>

  <!-- quadrant subtitles -->
  <g font-size="13" font-weight="700" fill="#475569">
    <text x="38" y="84">左上：理性 × 安靜（架構・規範・工具）</text>
    <text x="762" y="84" text-anchor="end">右上：感性 × 安靜（品牌・工藝・奢華）</text>
    <text x="38" y="454">左下：理性 × 熱鬧（SaaS・儀表板・App）</text>
    <text x="762" y="454" text-anchor="end">右下：感性 × 熱鬧（策展・潮流・活動）</text>
  </g>

  <!-- Quadrant 1: 理性 × 安靜 (左上) -->
  <g font-size="15" font-weight="700">
    <rect x="38" y="108" width="164" height="40" rx="20" fill="#FFFFFF" stroke="#111827" stroke-width="1.5"/><text x="120" y="133" text-anchor="middle" fill="#111827">① 極簡風</text>
    <rect x="218" y="108" width="164" height="40" rx="6" fill="#E5E7EB" stroke="#374151" stroke-width="1.5"/><text x="300" y="133" text-anchor="middle" fill="#111827">⑪ 工業技術風</text>
    <rect x="38" y="168" width="164" height="40" rx="0" fill="#FFFFFF" stroke="#E5322D" stroke-width="1.5"/><text x="120" y="193" text-anchor="middle" fill="#E5322D">⑥ 瑞士格線風</text>
    <rect x="218" y="168" width="164" height="40" rx="20" fill="#FFFFFF" stroke="#1B5E3A" stroke-width="1.5"/><text x="300" y="193" text-anchor="middle" fill="#1B5E3A">⑩ 公共服務風</text>
  </g>

  <!-- Quadrant 2: 感性 × 安靜 (右上) -->
  <g font-size="15" font-weight="700">
    <rect x="418" y="108" width="164" height="40" rx="20" fill="#FFFFFF" stroke="#8B5E3C" stroke-width="1.5"/><text x="500" y="133" text-anchor="middle" fill="#8B5E3C">② 編輯雜誌風</text>
    <rect x="598" y="108" width="164" height="40" rx="20" fill="#0D0C0A"/><text x="680" y="133" text-anchor="middle" fill="#C9A962">⑨ 暗黑奢華風</text>
    <rect x="418" y="168" width="164" height="40" rx="4" fill="#F4EAD5" stroke="#B8332A" stroke-width="1.5"/><text x="500" y="193" text-anchor="middle" fill="#B8332A">⑫ 復古懷舊紙本風</text>
    <rect x="598" y="168" width="164" height="40" rx="20" fill="#FFFFFF" stroke="#5B7B6D" stroke-width="1.5"/><text x="680" y="193" text-anchor="middle" fill="#5B7B6D">⑧ 柔和療癒風</text>
  </g>

  <!-- Quadrant 3: 理性 × 熱鬧 (左下) -->
  <g font-size="15" font-weight="700">
    <rect x="38" y="300" width="164" height="40" rx="20" fill="#FFFFFF" stroke="#2563EB" stroke-width="1.5"/><text x="120" y="325" text-anchor="middle" fill="#2563EB">③ 現代 SaaS 風</text>
    <rect x="218" y="300" width="164" height="40" rx="20" fill="#F3F4F6" stroke="#111827" stroke-width="1.5"/><text x="300" y="325" text-anchor="middle" fill="#111827">④ 便當盒格狀</text>
    <rect x="38" y="360" width="164" height="40" rx="20" fill="#1E1B4B"/><text x="120" y="385" text-anchor="middle" fill="#FFFFFF">⑦ 玻璃擬態</text>
    <rect x="218" y="360" width="164" height="40" rx="20" fill="#FCE7F3" stroke="#EC4899" stroke-width="1.5"/><text x="300" y="385" text-anchor="middle" fill="#BE185D">⑬ 3D 黏土軟膠風</text>
  </g>

  <!-- Quadrant 4: 感性 × 熱鬧 (右下) -->
  <g font-size="15" font-weight="700">
    <rect x="418" y="300" width="164" height="40" rx="0" fill="#FDE047" stroke="#000000" stroke-width="2"/><text x="500" y="325" text-anchor="middle" fill="#000000">⑤ 新粗野主義</text>
    <rect x="598" y="300" width="164" height="40" rx="4" fill="#0B0719" stroke="#CCFF00" stroke-width="1.5"/><text x="680" y="325" text-anchor="middle" fill="#CCFF00">⑭ Y2K 千禧潮流</text>
    <rect x="418" y="360" width="164" height="40" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" stroke-dasharray="4 2"/><text x="500" y="385" text-anchor="middle" fill="#92400E">⑮ 手繪拼貼雜誌</text>
    <rect x="598" y="360" width="164" height="40" rx="20" fill="#1E1B4B" stroke="#818CF8" stroke-width="1.5"/><text x="680" y="385" text-anchor="middle" fill="#E0E7FF">⑯ 沉浸式光影敘事</text>
  </g>

  <text x="400" y="502" text-anchor="middle" font-size="13.5" fill="#4B5563">提示：點選下方圖鑑表格任一風格連結，即可查看專屬 PRD 範例與 AI 關鍵字教學</text>
</svg>
