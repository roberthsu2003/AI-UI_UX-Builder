<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="800" height="330" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">畫面變化量：變得越多，感覺走得越遠</text>

  <!-- small change -->
  <text x="40" y="76" font-size="14" font-weight="700" fill="#059669">變化量小 → 「只是隔壁」</text>
  <g>
    <rect x="40" y="88" width="140" height="170" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="40" y="88" width="140" height="18" rx="6" fill="#E5E7EB"/>
    <rect x="40" y="106" width="36" height="152" fill="#F3F4F6"/>
    <rect x="84" y="114" width="88" height="60" rx="3" fill="#BBF7D0"/>
    <g fill="#E5E7EB"><rect x="84" y="182" width="88" height="8" rx="2"/><rect x="84" y="196" width="70" height="8" rx="2"/></g>
    <rect x="230" y="88" width="140" height="170" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="230" y="88" width="140" height="18" rx="6" fill="#E5E7EB"/>
    <rect x="230" y="106" width="36" height="152" fill="#F3F4F6"/>
    <rect x="274" y="114" width="88" height="60" rx="3" fill="#FDE68A"/>
    <g fill="#E5E7EB"><rect x="274" y="182" width="88" height="8" rx="2"/><rect x="274" y="196" width="60" height="8" rx="2"/></g>
  </g>
  <path d="M184 172 H226" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>
  <text x="40" y="284" font-size="12" fill="#374151">導覽列、側欄都不變，只有內容換了</text>
  <text x="40" y="304" font-size="12" fill="#6B7280">例：同分類的下一個商品、文件的下一節</text>

  <!-- big change -->
  <text x="430" y="76" font-size="14" font-weight="700" fill="#DC2626">變化量大 → 「到了別的地方」</text>
  <g>
    <rect x="430" y="88" width="140" height="170" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="430" y="88" width="140" height="18" rx="6" fill="#E5E7EB"/>
    <rect x="438" y="114" width="124" height="60" rx="3" fill="#BBF7D0"/>
    <g fill="#E5E7EB"><rect x="438" y="182" width="38" height="66" rx="3"/><rect x="481" y="182" width="38" height="66" rx="3"/><rect x="524" y="182" width="38" height="66" rx="3"/></g>
    <rect x="620" y="88" width="140" height="170" rx="6" fill="#1F2937"/>
    <rect x="644" y="116" width="92" height="12" rx="2" fill="#4B5563"/>
    <g fill="#FFFFFF" stroke="#4B5563"><rect x="644" y="140" width="92" height="18" rx="3"/><rect x="644" y="166" width="92" height="18" rx="3"/><rect x="644" y="192" width="92" height="18" rx="3"/></g>
    <rect x="644" y="220" width="92" height="20" rx="10" fill="#F59E0B"/>
  </g>
  <path d="M574 172 H616" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>
  <text x="430" y="284" font-size="12" fill="#374151">版面、顏色、功能全部改變</text>
  <text x="430" y="304" font-size="12" fill="#6B7280">例：從商品首頁進入結帳流程</text>
</svg>
