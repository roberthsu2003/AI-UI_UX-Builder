<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#059669"/></marker>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#D97706"/></marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">網站是一個立體空間：每次移動都屬於三個方向之一</text>

  <!-- vertical -->
  <g font-size="11" text-anchor="middle">
    <rect x="80" y="70" width="110" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB"/><text x="135" y="95" fill="#1D4ED8">首頁</text>
    <rect x="80" y="150" width="110" height="40" rx="6" fill="#DBEAFE" stroke="#2563EB"/><text x="135" y="175" fill="#1D4ED8">家電分類</text>
    <rect x="80" y="230" width="110" height="40" rx="6" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/><text x="135" y="255" fill="#1D4ED8">吸塵器 A</text>
  </g>
  <g stroke="#2563EB" stroke-width="2" marker-end="url(#b)" marker-start="url(#b)"><path d="M135 114 V146"/><path d="M135 194 V226"/></g>
  <text x="40" y="306" font-size="14" font-weight="700" fill="#1D4ED8">↕ 垂直：上下階層</text>
  <text x="40" y="328" font-size="12" fill="#374151">往下更細、往上更大</text>
  <text x="40" y="348" font-size="12" fill="#6B7280">常見做法：換頁＋麵包屑</text>

  <!-- horizontal -->
  <g font-size="11" text-anchor="middle">
    <rect x="290" y="230" width="90" height="40" rx="6" fill="#D1FAE5" stroke="#059669"/><text x="335" y="255" fill="#047857">吸塵器 A</text>
    <rect x="410" y="230" width="90" height="40" rx="6" fill="#FFFFFF" stroke="#059669" stroke-width="2"/><text x="455" y="255" fill="#047857">吸塵器 B</text>
    <rect x="530" y="230" width="90" height="40" rx="6" fill="#D1FAE5" stroke="#059669"/><text x="575" y="255" fill="#047857">吸塵器 C</text>
  </g>
  <g stroke="#059669" stroke-width="2" marker-end="url(#g)" marker-start="url(#g)"><path d="M384 250 H406"/><path d="M504 250 H526"/></g>
  <text x="290" y="306" font-size="14" font-weight="700" fill="#047857">↔ 水平：同一層之間</text>
  <text x="290" y="328" font-size="12" fill="#374151">層級不變，換同類的內容</text>
  <text x="290" y="348" font-size="12" fill="#6B7280">常見做法：上一個／下一個、頁籤</text>

  <!-- depth -->
  <rect x="640" y="80" width="120" height="150" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  <rect x="660" y="100" width="80" height="10" rx="2" fill="#D1D5DB"/>
  <rect x="660" y="118" width="80" height="50" rx="3" fill="#E5E7EB"/>
  <rect x="664" y="132" width="110" height="110" rx="8" fill="#FFFFFF" stroke="#D97706" stroke-width="2" opacity="0.95"/>
  <rect x="676" y="146" width="86" height="56" rx="3" fill="#FEF3C7"/>
  <text x="719" y="178" font-size="11" fill="#B45309" text-anchor="middle">放大圖片</text>
  <text x="760" y="226" font-size="12" fill="#B45309" text-anchor="end">✕ 關閉</text>
  <path d="M630 210 L612 228" stroke="#D97706" stroke-width="2" marker-end="url(#o)" marker-start="url(#o)"/>
  <text x="560" y="306" font-size="14" font-weight="700" fill="#B45309">⇲ 前後：疊在上面</text>
  <text x="560" y="328" font-size="12" fill="#374151">關閉後回到原畫面</text>
  <text x="560" y="348" font-size="12" fill="#6B7280">常見做法：彈出視窗、側邊抽屜</text>

  <text x="40" y="384" font-size="12" fill="#6B7280">同一種移動，永遠用同一種呈現方式，使用者就能憑直覺知道自己往哪裡走。</text>
</svg>
