<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="300" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">標示「目前位置」的四種視覺差異（同一個選單，目前在「課程」）</text>

  <g font-size="13" fill="#6B7280">
    <!-- bold -->
    <rect x="40" y="66" width="170" height="160" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="56" y="96">首頁</text><text x="56" y="126" font-weight="800" fill="#111827">課程</text><text x="56" y="156">講師</text><text x="56" y="186">價格</text>
    <!-- color -->
    <rect x="225" y="66" width="170" height="160" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="241" y="96">首頁</text><text x="241" y="126" fill="#2563EB">課程</text><text x="241" y="156">講師</text><text x="241" y="186">價格</text>
    <!-- background -->
    <rect x="410" y="66" width="170" height="160" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <rect x="420" y="108" width="150" height="28" rx="6" fill="#DBEAFE"/>
    <text x="436" y="96">首頁</text><text x="436" y="126" fill="#1D4ED8">課程</text><text x="436" y="156">講師</text><text x="436" y="186">價格</text>
    <!-- symbol -->
    <rect x="595" y="66" width="170" height="160" rx="10" fill="#F9FAFB" stroke="#E5E7EB"/>
    <rect x="605" y="110" width="4" height="22" rx="2" fill="#2563EB"/>
    <text x="621" y="96">首頁</text><text x="621" y="126" fill="#111827">課程</text><text x="621" y="156">講師</text><text x="621" y="186">價格</text>
    <text x="660" y="126" fill="#2563EB">▸</text>
  </g>
  <g font-size="14" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="125" y="252">粗體字</text><text x="310" y="252">文字顏色</text><text x="495" y="252">背景色</text><text x="680" y="252">符號（線條、箭頭）</text>
  </g>
  <text x="40" y="282" font-size="12" fill="#6B7280">實務上常組合兩種，例如「文字顏色＋背景色」，差異更明顯；也不要只靠顏色，色弱的人會看不出來。</text>
</svg>
