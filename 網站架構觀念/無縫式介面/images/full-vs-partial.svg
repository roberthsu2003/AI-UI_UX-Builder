<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="800" height="320" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">按下「加入購物車」之後……</text>

  <!-- full reload -->
  <text x="40" y="76" font-size="14" font-weight="700" fill="#DC2626">傳統換頁：整個畫面重新載入</text>
  <rect x="40" y="88" width="140" height="160" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="48" y="96" width="124" height="12" rx="2" fill="#E5E7EB"/>
  <rect x="48" y="116" width="124" height="60" rx="3" fill="#E5E7EB"/>
  <rect x="48" y="186" width="80" height="22" rx="11" fill="#2563EB"/>
  <path d="M186 168 H222" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>
  <rect x="228" y="88" width="140" height="160" rx="8" fill="#F3F4F6" stroke="#D1D5DB"/>
  <circle cx="298" cy="160" r="18" fill="none" stroke="#9CA3AF" stroke-width="4" stroke-dasharray="70 40"/>
  <text x="298" y="200" font-size="11" fill="#6B7280" text-anchor="middle">載入中…畫面閃白</text>
  <g font-size="12" fill="#374151">
    <text x="40" y="276">✘ 畫面閃一下，捲動位置跑掉</text>
    <text x="40" y="296">✘ 看不出「哪個操作」造成「哪個結果」</text>
  </g>

  <!-- partial -->
  <text x="430" y="76" font-size="14" font-weight="700" fill="#059669">無縫式：只更新有變化的地方</text>
  <rect x="430" y="88" width="140" height="160" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="438" y="96" width="124" height="12" rx="2" fill="#E5E7EB"/>
  <rect x="438" y="116" width="124" height="60" rx="3" fill="#E5E7EB"/>
  <rect x="438" y="186" width="80" height="22" rx="11" fill="#2563EB"/>
  <path d="M576 168 H612" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>
  <rect x="618" y="88" width="140" height="160" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="626" y="96" width="124" height="12" rx="2" fill="#E5E7EB"/>
  <circle cx="740" cy="102" r="8" fill="#DC2626"/><text x="740" y="106" font-size="10" fill="#FFFFFF" text-anchor="middle">1</text>
  <rect x="626" y="116" width="124" height="60" rx="3" fill="#E5E7EB"/>
  <rect x="626" y="186" width="96" height="22" rx="11" fill="#059669"/><text x="674" y="201" font-size="10" fill="#FFFFFF" text-anchor="middle">✓ 已加入</text>
  <g font-size="12" fill="#374151">
    <text x="430" y="276">✔ 只有按鈕和購物車數字改變</text>
    <text x="430" y="296">✔ 使用者清楚知道操作成功了，可以繼續逛</text>
  </g>
</svg>
