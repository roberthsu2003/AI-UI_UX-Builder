<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 350" width="800" height="350" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="350" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">一致性：換了頁，還是感覺在「同一個網站」</text>

  <!-- three pages -->
  <g>
    <g transform="translate(40,62)">
      <rect width="210" height="200" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <rect width="210" height="28" rx="8" fill="#1F2937"/>
      <rect x="10" y="9" width="40" height="10" rx="2" fill="#FBBF24"/>
      <rect x="10" y="40" width="120" height="14" rx="2" fill="#374151"/>
      <rect x="10" y="64" width="190" height="60" rx="4" fill="#E5E7EB"/>
      <rect x="10" y="136" width="80" height="24" rx="12" fill="#2563EB"/>
      <rect y="172" width="210" height="28" rx="8" fill="#E5E7EB"/>
      <text x="105" y="222" font-size="12" fill="#374151" text-anchor="middle">首頁</text>
    </g>
    <g transform="translate(295,62)">
      <rect width="210" height="200" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <rect width="210" height="28" rx="8" fill="#1F2937"/>
      <rect x="10" y="9" width="40" height="10" rx="2" fill="#FBBF24"/>
      <rect x="10" y="40" width="90" height="14" rx="2" fill="#374151"/>
      <g fill="#E5E7EB"><rect x="10" y="64" width="58" height="60" rx="4"/><rect x="76" y="64" width="58" height="60" rx="4"/><rect x="142" y="64" width="58" height="60" rx="4"/></g>
      <rect x="10" y="136" width="80" height="24" rx="12" fill="#2563EB"/>
      <rect y="172" width="210" height="28" rx="8" fill="#E5E7EB"/>
      <text x="105" y="222" font-size="12" fill="#374151" text-anchor="middle">商品列表</text>
    </g>
    <g transform="translate(550,62)">
      <rect width="210" height="200" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
      <rect width="210" height="28" rx="8" fill="#1F2937"/>
      <rect x="10" y="9" width="40" height="10" rx="2" fill="#FBBF24"/>
      <rect x="10" y="40" width="140" height="14" rx="2" fill="#374151"/>
      <g fill="#FFFFFF" stroke="#D1D5DB"><rect x="10" y="64" width="190" height="18" rx="3"/><rect x="10" y="88" width="190" height="18" rx="3"/></g>
      <rect x="10" y="136" width="80" height="24" rx="12" fill="#2563EB"/>
      <rect y="172" width="210" height="28" rx="8" fill="#E5E7EB"/>
      <text x="105" y="222" font-size="12" fill="#374151" text-anchor="middle">聯絡我們</text>
    </g>
  </g>
  <g font-size="12" fill="#374151">
    <text x="40" y="308"><tspan font-weight="700" fill="#111827">不變的（規則）：</tspan>深色頁首與黃色 Logo、標題的樣式、藍色膠囊按鈕、灰色頁尾</text>
    <text x="40" y="330"><tspan font-weight="700" fill="#111827">會變的（自由）：</tspan>中間的內容：大圖、商品格子、表單</text>
  </g>
</svg>
