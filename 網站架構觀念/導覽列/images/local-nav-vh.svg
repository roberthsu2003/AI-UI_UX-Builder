<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="320" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">區域導覽列的兩種方向</text>

  <!-- vertical -->
  <text x="40" y="76" font-size="14" font-weight="700" fill="#059669">垂直型（放在側邊）</text>
  <rect x="40" y="88" width="320" height="170" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="48" y="96" width="304" height="14" rx="3" fill="#E5E7EB"/>
  <rect x="48" y="118" width="96" height="132" rx="4" fill="#ECFDF5"/>
  <g font-size="11" fill="#047857"><text x="56" y="138">捷運路線</text><text x="66" y="156">文湖線</text><text x="66" y="174" font-weight="700">淡水信義線</text><text x="66" y="192">松山新店線</text><text x="56" y="214">票價</text><text x="56" y="234">轉乘優惠</text></g>
  <rect x="58" y="164" width="3" height="14" fill="#059669"/>
  <rect x="152" y="118" width="200" height="132" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="12" fill="#374151">
    <text x="40" y="280">✔ 看得出階層、能放很多項目</text>
    <text x="40" y="300" fill="#6B7280">✘ 佔掉一整條寬度，主要內容變窄</text>
  </g>

  <!-- horizontal -->
  <text x="420" y="76" font-size="14" font-weight="700" fill="#2563EB">水平型（放在上方）</text>
  <rect x="420" y="88" width="340" height="170" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="428" y="96" width="324" height="14" rx="3" fill="#E5E7EB"/>
  <rect x="428" y="116" width="324" height="28" rx="4" fill="#EFF6FF"/>
  <g font-size="11" fill="#1D4ED8"><text x="440" y="134">MacBook Air</text><text x="526" y="134" font-weight="700">MacBook Pro</text><text x="616" y="134">iMac</text><text x="660" y="134">Mac mini</text></g>
  <path d="M526 140 H600" stroke="#2563EB" stroke-width="2"/>
  <rect x="428" y="150" width="324" height="100" rx="4" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="12" fill="#374151">
    <text x="420" y="280">✔ 一眼看完、不壓縮主要內容</text>
    <text x="420" y="300" fill="#6B7280">✘ 只能放同一層、項目不能太多</text>
  </g>
</svg>
