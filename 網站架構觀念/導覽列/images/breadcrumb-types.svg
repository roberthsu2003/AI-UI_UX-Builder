<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="380" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">一個商品屬於兩個分類時，麵包屑怎麼顯示？</text>

  <!-- tree -->
  <g stroke="#D1D5DB" stroke-width="1.5"><path d="M160 84 L90 134 M160 84 L230 134 M90 156 L160 210 M230 156 L160 210"/></g>
  <g font-size="12" text-anchor="middle">
    <rect x="120" y="64" width="80" height="22" rx="5" fill="#F3F4F6" stroke="#D1D5DB"/><text x="160" y="80" fill="#374151">首頁</text>
    <rect x="40" y="134" width="100" height="22" rx="5" fill="#DBEAFE" stroke="#2563EB"/><text x="90" y="150" fill="#1D4ED8">影音設備</text>
    <rect x="180" y="134" width="100" height="22" rx="5" fill="#FEF3C7" stroke="#D97706"/><text x="230" y="150" fill="#B45309">行動裝置</text>
    <rect x="110" y="210" width="100" height="24" rx="5" fill="#111827"/><text x="160" y="227" fill="#FFFFFF" font-weight="700">藍牙耳機</text>
  </g>
  <text x="40" y="270" font-size="12" fill="#6B7280">同一個商品，從兩條路都到得了</text>

  <!-- three types -->
  <g font-size="12">
    <text x="320" y="78" font-size="14" font-weight="700" fill="#111827">① 優先型：永遠只顯示一條</text>
    <rect x="320" y="88" width="440" height="30" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="332" y="108" fill="#1D4ED8">首頁 ＞ 影音設備 ＞ <tspan fill="#111827">藍牙耳機</tspan></text>
    <text x="320" y="136" fill="#6B7280">簡單、每頁只有一個地址；但看不出使用者真正走的路</text>

    <text x="320" y="170" font-size="14" font-weight="700" fill="#111827">② 複數型：全部列出來</text>
    <rect x="320" y="180" width="440" height="50" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="332" y="200" fill="#1D4ED8">首頁 ＞ 影音設備 ＞ <tspan fill="#111827">藍牙耳機</tspan></text>
    <text x="332" y="220" fill="#B45309">首頁 ＞ 行動裝置 ＞ <tspan fill="#111827">藍牙耳機</tspan></text>
    <text x="320" y="248" fill="#6B7280">所有路都看得到；但佔空間，一頁有好幾個地址感覺怪</text>

    <text x="320" y="282" font-size="14" font-weight="700" fill="#111827">③ 變動型：依使用者走的路顯示</text>
    <rect x="320" y="292" width="440" height="30" rx="6" fill="#F9FAFB" stroke="#E5E7EB"/>
    <text x="332" y="312" fill="#B45309">從「行動裝置」點進來 → 首頁 ＞ 行動裝置 ＞ <tspan fill="#111827">藍牙耳機</tspan></text>
    <text x="320" y="340" fill="#6B7280">最貼近使用者；但要依網址參數或上一頁判斷，實作較難</text>
  </g>
</svg>
