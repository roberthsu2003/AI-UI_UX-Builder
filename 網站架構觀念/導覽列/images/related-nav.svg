    <rect x="330" y="132" width="80" height="22" rx="5" fill="#F3F4F6" stroke="#D1D5DB"/><text x="370" y="148" fill="#374151">戶外</text>
    <rect x="40" y="206" width="80" height="24" rx="5" fill="#111827"/><text x="80" y="223" fill="#FFFFFF" font-weight="700">相機 A</text>
