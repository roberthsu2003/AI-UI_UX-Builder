<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="300" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">大家都學會的共通概念：放在使用者預期的地方</text>

  <rect x="40" y="70" width="720" height="60" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <!-- hamburger -->
  <g stroke="#111827" stroke-width="2.5"><path d="M60 92 h20 M60 100 h20 M60 108 h20"/></g>
  <!-- logo -->
  <rect x="100" y="88" width="80" height="24" rx="4" fill="#111827"/><text x="140" y="105" font-size="12" fill="#FFF" text-anchor="middle" font-weight="700">LOGO</text>
  <!-- search -->
  <rect x="300" y="86" width="220" height="28" rx="14" fill="#FFFFFF" stroke="#D1D5DB"/>
  <circle cx="320" cy="99" r="6" fill="none" stroke="#6B7280" stroke-width="2"/><path d="M324 103 l5 5" stroke="#6B7280" stroke-width="2"/>
  <text x="336" y="104" font-size="12" fill="#9CA3AF">搜尋商品</text>
  <!-- member -->
  <circle cx="660" cy="96" r="7" fill="none" stroke="#111827" stroke-width="2"/><path d="M648 112 C648 102 672 102 672 112" fill="none" stroke="#111827" stroke-width="2"/>
  <!-- cart -->
  <path d="M700 88 h6 l5 18 h18 l4 -12 h-24" fill="none" stroke="#111827" stroke-width="2"/><circle cx="714" cy="112" r="2.5" fill="#111827"/><circle cx="728" cy="112" r="2.5" fill="#111827"/>
  <circle cx="736" cy="86" r="8" fill="#DC2626"/><text x="736" y="90" font-size="10" fill="#FFF" text-anchor="middle">3</text>

  <g font-size="12" fill="#374151" text-anchor="middle">
    <path d="M70 136 V160" stroke="#9CA3AF"/><text x="70" y="178">☰ 主選單</text>
    <path d="M140 136 V160" stroke="#9CA3AF"/><text x="140" y="178">點了回首頁</text>
    <path d="M410 136 V160" stroke="#9CA3AF"/><text x="410" y="178">放大鏡＝搜尋</text>
    <path d="M660 136 V160" stroke="#9CA3AF"/><text x="660" y="178">人像＝會員</text>
    <path d="M730 136 V196" stroke="#9CA3AF"/><text x="730" y="214">紅點數字＝</text><text x="730" y="230">購物車有 3 件</text>
  </g>
  <text x="40" y="270" font-size="13" fill="#111827"><tspan font-weight="700">雅各布定律：</tspan>使用者大部分時間都在「別人的網站」，所以他們期待你的網站也這樣運作。</text>
</svg>
