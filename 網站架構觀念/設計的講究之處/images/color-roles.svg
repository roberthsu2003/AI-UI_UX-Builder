<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">顏色是用來「判別」的</text>

  <!-- 60 30 10 -->
  <text x="40" y="78" font-size="14" font-weight="700" fill="#111827">60-30-10 配色比例</text>
  <rect x="40" y="90" width="330" height="190" rx="8" fill="#F8FAFC" stroke="#E2E8F0"/>
  <g fill="#E2E8F0"><rect x="52" y="104" width="306" height="14" rx="2"/></g>
  <rect x="52" y="128" width="148" height="100" rx="6" fill="#DBEAFE"/>
  <rect x="210" y="128" width="148" height="100" rx="6" fill="#DBEAFE"/>
  <rect x="52" y="240" width="96" height="28" rx="14" fill="#EA580C"/><text x="100" y="259" font-size="12" fill="#FFF" text-anchor="middle">立即報名</text>
  <g font-size="12">
    <rect x="40" y="292" width="198" height="14" fill="#F8FAFC" stroke="#E2E8F0"/><rect x="238" y="292" width="99" height="14" fill="#DBEAFE"/><rect x="337" y="292" width="33" height="14" fill="#EA580C"/>
    <text x="40" y="326" fill="#374151">60% 背景　　　　30% 區塊　　10% 強調</text>
    <text x="40" y="346" fill="#6B7280">強調色越少，主要按鈕越突出</text>
  </g>

  <!-- status + not only color -->
  <text x="420" y="78" font-size="14" font-weight="700" fill="#111827">狀態色要固定，而且不能只靠顏色</text>
  <g font-size="12">
    <rect x="420" y="92" width="80" height="26" rx="6" fill="#DCFCE7"/><text x="460" y="110" fill="#166534" text-anchor="middle">✓ 成功</text>
    <rect x="510" y="92" width="80" height="26" rx="6" fill="#FEF3C7"/><text x="550" y="110" fill="#92400E" text-anchor="middle">! 警告</text>
    <rect x="600" y="92" width="80" height="26" rx="6" fill="#FEE2E2"/><text x="640" y="110" fill="#991B1B" text-anchor="middle">✕ 錯誤</text>
    <rect x="690" y="92" width="70" height="26" rx="6" fill="#DBEAFE"/><text x="725" y="110" fill="#1E40AF" text-anchor="middle">i 資訊</text>

    <text x="420" y="152" font-weight="700" fill="#DC2626">✘ 只靠顏色</text>
    <text x="420" y="172" fill="#374151">電子郵件</text>
    <rect x="420" y="178" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="428" y="197" fill="#374151">abc@</text>
    <text x="600" y="152" font-weight="700" fill="#059669">✔ 顏色＋圖示＋文字</text>
    <text x="600" y="172" fill="#374151">電子郵件</text>
    <rect x="600" y="178" width="160" height="28" rx="6" fill="#FFFFFF" stroke="#DC2626" stroke-width="2"/>
    <text x="608" y="197" fill="#374151">abc@</text>
    <text x="600" y="224" fill="#B91C1C">⚠ 請輸入完整的 Email</text>

    <text x="420" y="270" font-weight="700" fill="#111827">對比要夠（WCAG AA 4.5:1）</text>
    <rect x="420" y="282" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/><text x="432" y="307" fill="#D1D5DB">淺灰字看不清楚</text>
    <rect x="600" y="282" width="160" height="40" rx="6" fill="#FFFFFF" stroke="#E5E7EB"/><text x="612" y="307" fill="#4B5563">深灰字清楚易讀</text>
  </g>
</svg>
