<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/></marker>
  </defs>
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">漸進式揭露：先給重點，有興趣再展開</text>

  <!-- product card -->
  <rect x="40" y="62" width="300" height="250" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="52" y="74" width="276" height="80" rx="6" fill="#E5E7EB"/>
  <text x="52" y="178" font-size="15" font-weight="700" fill="#111827">無線吸塵器 V12</text>
  <text x="52" y="204" font-size="18" font-weight="800" fill="#DC2626">NT$ 12,900</text>
  <text x="200" y="204" font-size="12" fill="#B91C1C">優惠至 11/30</text>
  <g font-size="12">
    <rect x="52" y="216" width="276" height="26" rx="5" fill="#F3F4F6"/><text x="62" y="234" fill="#374151">▸ 規格說明</text>
    <rect x="52" y="246" width="276" height="26" rx="5" fill="#F3F4F6"/><text x="62" y="264" fill="#374151">▸ 保固與退換貨</text>
    <rect x="52" y="276" width="276" height="26" rx="5" fill="#F3F4F6"/><text x="62" y="294" fill="#374151">▸ 128 則評價</text>
  </g>
  <path d="M346 230 H396" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>
  <text x="371" y="220" font-size="11" fill="#6B7280" text-anchor="middle">點開</text>

  <!-- expanded -->
  <rect x="402" y="200" width="200" height="112" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="414" y="222" font-size="12" font-weight="700" fill="#111827">▾ 規格說明</text>
  <g font-size="11" fill="#374151"><text x="414" y="244">重量 1.5 kg</text><text x="414" y="262">續航 60 分鐘</text><text x="414" y="280">集塵盒 0.35 L</text><text x="414" y="298">充電 3.5 小時</text></g>

  <!-- rules -->
  <rect x="402" y="62" width="358" height="124" rx="10" fill="#FEF2F2"/>
  <text x="418" y="88" font-size="13" font-weight="700" fill="#B91C1C">一定要直接顯示，不能藏起來</text>
  <g font-size="12" fill="#374151">
    <text x="418" y="112">・價格、優惠期限</text>
    <text x="418" y="132">・申辦資格、截止日期</text>
    <text x="418" y="152">・會影響決定的限制（例如不能退貨）</text>
  </g>
  <text x="418" y="174" font-size="11" fill="#6B7280">收合、輪播裡的內容，很多人根本不會看到</text>

  <rect x="620" y="200" width="140" height="112" rx="10" fill="#ECFDF5"/>
  <text x="634" y="224" font-size="12" font-weight="700" fill="#047857">適合收起來的</text>
  <g font-size="11" fill="#374151"><text x="634" y="246">・詳細規格</text><text x="634" y="264">・完整條款</text><text x="634" y="282">・更多評價</text></g>
</svg>
