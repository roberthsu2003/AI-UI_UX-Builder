<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">極簡：不是東西少，而是沒有多餘的東西</text>

  <!-- before -->
  <text x="40" y="76" font-size="14" font-weight="700" fill="#DC2626">改之前：每個東西都在搶注意力</text>
  <rect x="40" y="88" width="330" height="200" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="48" y="96" width="314" height="14" rx="2" fill="#E5E7EB"/>
  <rect x="300" y="116" width="62" height="40" rx="3" fill="#FCA5A5"/><text x="331" y="140" font-size="10" fill="#7F1D1D" text-anchor="middle">廣告</text>
  <rect x="48" y="116" width="244" height="40" rx="3" fill="#E5E7EB"/>
  <g font-size="10" text-anchor="middle">
    <rect x="48" y="164" width="56" height="20" rx="10" fill="#2563EB"/><text x="76" y="178" fill="#FFF">登入</text>
    <rect x="110" y="164" width="56" height="20" rx="10" fill="#059669"/><text x="138" y="178" fill="#FFF">註冊</text>
    <rect x="172" y="164" width="70" height="20" rx="10" fill="#D97706"/><text x="207" y="178" fill="#FFF">訂閱電子報</text>
    <rect x="248" y="164" width="56" height="20" rx="10" fill="#DC2626"/><text x="276" y="178" fill="#FFF">立即購買</text>
    <rect x="310" y="164" width="52" height="20" rx="10" fill="#7C3AED"/><text x="336" y="178" fill="#FFF">分享</text>
  </g>
  <g fill="#E5E7EB"><rect x="48" y="192" width="314" height="8" rx="2"/><rect x="48" y="206" width="300" height="8" rx="2"/><rect x="48" y="220" width="314" height="8" rx="2"/><rect x="48" y="234" width="280" height="8" rx="2"/></g>
  <rect x="48" y="252" width="150" height="28" rx="3" fill="#FDE68A"/><text x="123" y="270" font-size="10" fill="#92400E" text-anchor="middle">限時優惠倒數！</text>
  <rect x="206" y="252" width="156" height="28" rx="3" fill="#BFDBFE"/><text x="284" y="270" font-size="10" fill="#1E3A8A" text-anchor="middle">熱門文章</text>

  <!-- after -->
  <text x="430" y="76" font-size="14" font-weight="700" fill="#059669">改之後：一眼看到最重要的事</text>
  <rect x="430" y="88" width="330" height="200" rx="8" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="438" y="96" width="314" height="14" rx="2" fill="#E5E7EB"/>
  <text x="440" y="96" font-size="9" fill="#6B7280" dy="10"></text>
  <rect x="438" y="122" width="314" height="64" rx="3" fill="#E5E7EB"/>
  <g fill="#E5E7EB"><rect x="438" y="198" width="220" height="8" rx="2"/><rect x="438" y="212" width="180" height="8" rx="2"/></g>
  <rect x="438" y="234" width="110" height="30" rx="15" fill="#DC2626"/><text x="493" y="254" font-size="11" fill="#FFF" text-anchor="middle">立即購買</text>
  <text x="562" y="254" font-size="11" fill="#2563EB">登入／註冊</text>

  <g font-size="12" fill="#374151">
    <text x="40" y="314">合併：登入＋註冊變成一個入口　隱藏：分享收進選單　延後：電子報放到頁尾</text>
    <text x="40" y="332">移除：沒人點的廣告。<tspan font-weight="700" fill="#DC2626">但「立即購買」這種核心功能一定要留著，而且要最明顯。</tspan></text>
  </g>
</svg>
