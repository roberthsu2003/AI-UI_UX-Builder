<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="380" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">回應式設計：同一份網頁，在「斷點」改變排法</text>

  <!-- ruler -->
  <path d="M40 300 H760" stroke="#9CA3AF" stroke-width="2"/>
  <g stroke="#DC2626" stroke-width="2"><path d="M260 290 V310"/><path d="M500 290 V310"/></g>
  <g font-size="11" fill="#DC2626" text-anchor="middle"><text x="260" y="326">斷點 768px</text><text x="500" y="326">斷點 1024px</text></g>
  <g font-size="11" fill="#6B7280"><text x="40" y="326">0</text><text x="760" y="326" text-anchor="end">畫面寬度 →</text></g>

  <!-- phone -->
  <text x="150" y="76" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">手機：1 欄</text>
  <rect x="110" y="88" width="80" height="190" rx="12" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="118" y="98" width="64" height="10" rx="2" fill="#E5E7EB"/>
  <g fill="#BFDBFE"><rect x="118" y="116" width="64" height="44" rx="3"/><rect x="118" y="166" width="64" height="44" rx="3"/><rect x="118" y="216" width="64" height="44" rx="3"/></g>

  <!-- tablet -->
  <text x="380" y="76" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">平板：2 欄</text>
  <rect x="300" y="88" width="160" height="190" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="310" y="98" width="140" height="10" rx="2" fill="#E5E7EB"/>
  <g fill="#BFDBFE"><rect x="310" y="116" width="66" height="56" rx="3"/><rect x="384" y="116" width="66" height="56" rx="3"/><rect x="310" y="180" width="66" height="56" rx="3"/></g>

  <!-- desktop -->
  <text x="630" y="76" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">電腦：3 欄</text>
  <rect x="530" y="88" width="230" height="190" rx="8" fill="#F9FAFB" stroke="#D1D5DB"/>
  <rect x="540" y="98" width="210" height="10" rx="2" fill="#E5E7EB"/>
  <g fill="#BFDBFE"><rect x="540" y="116" width="66" height="70" rx="3"/><rect x="612" y="116" width="66" height="70" rx="3"/><rect x="684" y="116" width="66" height="70" rx="3"/></g>
  <rect x="540" y="194" width="210" height="74" rx="3" fill="#E5E7EB"/>

  <text x="40" y="350" font-size="12" fill="#6B7280">不是做三份網頁，而是同一份 HTML 用 CSS 判斷寬度。</text><text x="40" y="368" font-size="12" fill="#6B7280">常見斷點：576、768、992、1200px（Bootstrap），或 640、768、1024、1280px（Tailwind）。</text>
</svg>
