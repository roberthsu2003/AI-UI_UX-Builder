<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">格狀設計：先畫好 12 條等寬的欄，所有東西都對齊它</text>

  <!-- 12 columns -->
  <g fill="#FEE2E2">
    <rect x="40" y="62" width="48" height="230"/><rect x="100" y="62" width="48" height="230"/><rect x="160" y="62" width="48" height="230"/><rect x="220" y="62" width="48" height="230"/>
    <rect x="280" y="62" width="48" height="230"/><rect x="340" y="62" width="48" height="230"/><rect x="400" y="62" width="48" height="230"/><rect x="460" y="62" width="48" height="230"/>
    <rect x="520" y="62" width="48" height="230"/><rect x="580" y="62" width="48" height="230"/><rect x="640" y="62" width="48" height="230"/><rect x="700" y="62" width="48" height="230"/>
  </g>
  <!-- elements spanning columns -->
  <g font-size="12" text-anchor="middle">
    <rect x="40" y="76" width="708" height="40" rx="4" fill="#1F2937" fill-opacity="0.85"/><text x="394" y="101" fill="#FFFFFF">橫跨 12 欄：主視覺</text>
    <rect x="40" y="128" width="228" height="70" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="154" y="168" fill="#FFFFFF">4 欄</text>
    <rect x="280" y="128" width="228" height="70" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="394" y="168" fill="#FFFFFF">4 欄</text>
    <rect x="520" y="128" width="228" height="70" rx="4" fill="#2563EB" fill-opacity="0.85"/><text x="634" y="168" fill="#FFFFFF">4 欄</text>
    <rect x="40" y="210" width="468" height="70" rx="4" fill="#059669" fill-opacity="0.85"/><text x="274" y="250" fill="#FFFFFF">8 欄：文章</text>
    <rect x="520" y="210" width="228" height="70" rx="4" fill="#D97706" fill-opacity="0.85"/><text x="634" y="250" fill="#FFFFFF">4 欄：側欄</text>
  </g>
  <text x="40" y="312" font-size="12" fill="#6B7280">12 可以被 2、3、4、6 整除，所以 12 欄最常用：要排 2、3、4、6 個東西都剛好對齊。</text><text x="40" y="330" font-size="12" fill="#6B7280">淡紅色是「欄」，欄與欄之間的空隙叫「欄間距（gutter）」。</text>
</svg>
