<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GSAP ScrollTrigger + Lenis 捲動敘事 Demo</title>
<link rel="stylesheet" href="demo.css">
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/ScrollTrigger.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/lenis@1.1.13/dist/lenis.min.js"></script>
<style>
  html.lenis, html.lenis body { height: auto; }
  .lenis.lenis-smooth { scroll-behavior: auto !important; }
  body { overflow: visible; background: #0b0b10; }
  .bar { position: fixed; top: 0; left: 0; height: 4px; width: 100%; background: linear-gradient(90deg, #8b7fff, #ff6b9d); transform-origin: left; transform: scaleX(0); z-index: 10; }
  section { min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; text-align: center; position: relative; overflow: hidden; }
  h1, h2 { margin: 0; line-height: 1.15; }
  h1 { font-size: clamp(32px, 8vw, 72px); }
  h2 { font-size: clamp(24px, 5vw, 44px); }
  p { color: #a3a3b2; }
  .s1 .orb { position: absolute; width: 60vmin; aspect-ratio: 1; border-radius: 50%; background: radial-gradient(circle at 35% 35%, #b4acff, #5b4cf0 55%, transparent 70%); filter: blur(4px); z-index: -1; }
  .reveal { font-size: clamp(22px, 4.6vw, 40px); font-weight: 800; max-width: 900px; line-height: 1.5; }
  .reveal span { opacity: .15; }
  .h-wrap { height: 100vh; overflow: hidden; display: flex; align-items: center; padding: 0; }
  .h-track { display: flex; gap: 4vw; padding: 0 10vw; will-change: transform; }
  .panel { flex: 0 0 min(70vw, 420px); aspect-ratio: 3 / 4; border-radius: 22px; display: grid; place-items: center; font-size: clamp(22px, 4vw, 34px); font-weight: 900; color: #fff; }
  .stat { font-size: clamp(56px, 14vw, 140px); font-weight: 900; background: linear-gradient(90deg, #5ee7df, #8b7fff); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .down { margin-top: 24px; font-size: 14px; color: #a3a3b2; animation: bob 1.4s ease-in-out infinite; }
  @keyframes bob { 50% { transform: translateY(8px); } }
</style>
</head>
<body>
<div class="bar" id="bar"></div>
<div class="hint">🖱️ 往下捲動：畫面會跟著捲動「演出」</div>

<section class="s1">
  <div class="orb" id="orb"></div>
  <div><h1 id="t1">捲動即敘事</h1><p>Scroll-telling：讓使用者的每一次捲動，推進一段故事</p><div class="down">↓ 往下捲</div></div>
</section>

<section><div class="reveal" id="reveal">當使用者往下捲動，文字會一個字一個字亮起來，引導視線停留在你最想傳達的訊息上。</div></section>

<section class="h-wrap" id="hwrap">
  <div class="h-track" id="htrack">
    <div class="panel" style="background:#5b4cf0">① 釘選畫面</div>
    <div class="panel" style="background:#c03fbf">② 垂直捲動</div>
    <div class="panel" style="background:#e0663a">③ 變成水平移動</div>
    <div class="panel" style="background:#1f9d74">④ 常見於品牌故事頁</div>
  </div>
</section>

<section><div><div class="stat" id="stat">0</div><p>數字隨捲動跳動（例如：服務人次、成長率）</p></div></section>

<section><div><h2>Lenis 讓捲動變得滑順</h2><p>GSAP ScrollTrigger 負責「捲到哪裡、播放什麼」，Lenis 負責「捲動手感」</p></div></section>

<script>
// GSAP ScrollTrigger：把動畫進度綁在捲軸位置上；Lenis：平滑捲動（Smooth Scroll）
gsap.registerPlugin(ScrollTrigger);
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;

if (!reduce) {
  const lenis = new Lenis({ lerp: 0.09 });
  lenis.on('scroll', ScrollTrigger.update);
  gsap.ticker.add(t => lenis.raf(t * 1000));
  gsap.ticker.lagSmoothing(0);
}

// 1. 頂部進度條
gsap.to('#bar', { scaleX: 1, ease: 'none', scrollTrigger: { start: 0, end: 'max', scrub: true } });

// 2. 主視覺：捲動時光球放大、標題淡出
gsap.to('#orb', { scale: 2.6, opacity: 0.2, scrollTrigger: { trigger: '.s1', start: 'top top', end: 'bottom top', scrub: true } });
gsap.to('#t1', { y: -120, opacity: 0, scrollTrigger: { trigger: '.s1', start: 'top top', end: 'bottom top', scrub: true } });

// 3. 逐字點亮
const rv = document.getElementById('reveal');
rv.innerHTML = [...rv.textContent].map(c => `<span>${c}</span>`).join('');
gsap.to('#reveal span', { opacity: 1, stagger: 0.05, ease: 'none', scrollTrigger: { trigger: '#reveal', start: 'top 80%', end: 'bottom 40%', scrub: true } });

// 4. 釘選 + 水平捲動
const track = document.getElementById('htrack');
gsap.to(track, {
  x: () => -(track.scrollWidth - innerWidth), ease: 'none',
  scrollTrigger: { trigger: '#hwrap', pin: true, scrub: 1, start: 'top top', end: () => '+=' + (track.scrollWidth - innerWidth), invalidateOnRefresh: true },
});

// 5. 數字跳動
const stat = { v: 0 };
gsap.to(stat, { v: 128000, ease: 'power1.out', scrollTrigger: { trigger: '#stat', start: 'top 85%', end: 'top 35%', scrub: true },
  onUpdate: () => { document.getElementById('stat').textContent = Math.round(stat.v).toLocaleString() + '+'; } });
</script>
</body>
</html>
