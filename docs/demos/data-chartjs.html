<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chart.js 儀表板圖表 Demo</title>
<link rel="stylesheet" href="demo.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<style>
  body { background: #f6f5f1; color: #1b1b1f; overflow: auto; }
  .dash { padding: 52px 16px 72px; display: grid; gap: 12px; grid-template-columns: 2fr 1fr; height: 100%; min-height: 360px; }
  @media (max-width: 640px) { .dash { grid-template-columns: 1fr; height: auto; } .panel { height: 260px; } }
  .panel { background: #fff; border-radius: 14px; padding: 12px 14px 14px; box-shadow: 0 6px 20px rgba(0,0,0,.06); display: flex; flex-direction: column; min-height: 0; }
  .panel h3 { margin: 0 0 6px; font-size: 14px; color: #5d5d68; font-weight: 600; }
  .panel .box { position: relative; flex: 1; min-height: 0; }
  .controls button, .controls label { color: #1b1b1f; background: #fff; border-color: #dcd9cf; }
  .controls button:hover { background: #eceae3; }
</style>
</head>
<body>
<div class="hint">📊 滑鼠移到圖上看數值 ・ 點圖例可隱藏數列 ・ 下方按鈕更新資料</div>
<div class="dash">
  <div class="panel"><h3>每月網站流量（人次）</h3><div class="box"><canvas id="main"></canvas></div></div>
  <div class="panel"><h3>流量來源</h3><div class="box"><canvas id="pie"></canvas></div></div>
</div>
<div class="controls">
  <button id="rand">🎲 隨機更新資料</button>
  <button id="type">🔁 切換 長條 / 折線</button>
</div>
<script>
// Chart.js：最容易上手的圖表函式庫，幾行設定就能做出漂亮、有動畫、可互動的標準圖表
const months = ['1月', '2月', '3月', '4月', '5月', '6月', '7月', '8月', '9月', '10月', '11月', '12月'];
const rnd = (a, b) => Math.round(a + Math.random() * (b - a));
const series = () => months.map((_, i) => rnd(3000, 6000) + i * 400);
Chart.defaults.font.family = '"Noto Sans TC", "PingFang TC", system-ui, sans-serif';

let type = 'line';
const mainCfg = () => ({
  type,
  data: { labels: months, datasets: [
    { label: '2025', data: series(), borderColor: '#5b4cf0', backgroundColor: type === 'line' ? 'rgba(91,76,240,.12)' : '#5b4cf0', fill: true, tension: 0.4, borderRadius: 6 },
    { label: '2026', data: series().map(v => v + 1500), borderColor: '#ff6b9d', backgroundColor: type === 'line' ? 'rgba(255,107,157,.10)' : '#ff6b9d', fill: true, tension: 0.4, borderRadius: 6 },
  ] },
  options: { responsive: true, maintainAspectRatio: false, interaction: { mode: 'index', intersect: false },
    plugins: { legend: { position: 'bottom' } },
    scales: { y: { grid: { color: '#eee' }, ticks: { callback: v => v.toLocaleString() } }, x: { grid: { display: false } } } },
});
let main = new Chart(document.getElementById('main'), mainCfg());

const pie = new Chart(document.getElementById('pie'), {
  type: 'doughnut',
  data: { labels: ['搜尋引擎', '社群', '直接造訪', '廣告'], datasets: [{ data: [42, 26, 20, 12], backgroundColor: ['#5b4cf0', '#ff6b9d', '#1f9d74', '#feca57'], borderWidth: 0, hoverOffset: 10 }] },
  options: { responsive: true, maintainAspectRatio: false, cutout: '62%', plugins: { legend: { position: 'bottom' } } },
});

document.getElementById('rand').onclick = () => {
  main.data.datasets.forEach((ds, i) => { ds.data = series().map(v => v + i * 1500); });
  main.update();
  pie.data.datasets[0].data = [rnd(20, 50), rnd(10, 35), rnd(10, 30), rnd(5, 20)];
  pie.update();
};
document.getElementById('type').onclick = () => {
  type = type === 'line' ? 'bar' : 'line';
  main.destroy();
  main = new Chart(document.getElementById('main'), mainCfg());
};
</script>
</body>
</html>
