<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 440" width="800" height="440" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="440" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- window -->
  <rect x="30" y="30" width="560" height="380" rx="10" fill="#F9FAFB" stroke="#D1D5DB"/>
  <!-- top tabs -->
  <rect x="30" y="30" width="560" height="36" rx="10" fill="#E5E7EB"/>
  <rect x="44" y="38" width="56" height="20" rx="4" fill="#FFFFFF"/>
  <text x="72" y="52" font-size="11" fill="#374151" text-anchor="middle">Home</text>
  <rect x="106" y="38" width="96" height="20" rx="4" fill="#FFFFFF" stroke="#2563EB"/>
  <text x="154" y="52" font-size="11" fill="#2563EB" text-anchor="middle">ch02.pen</text>
  <!-- left layers -->
  <rect x="30" y="66" width="130" height="344" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="11" fill="#374151">
    <text x="42" y="88" font-weight="700">Layers</text>
    <text x="42" y="112">▾ 登入頁</text>
    <text x="56" y="132">▸ Header</text>
    <text x="56" y="152">▾ 表單</text>
    <text x="70" y="172">帳號欄位</text>
    <text x="70" y="192">密碼欄位</text>
    <rect x="64" y="200" width="88" height="18" rx="3" fill="#DBEAFE"/>
    <text x="70" y="213">登入按鈕</text>
  </g>
  <!-- right properties -->
  <rect x="440" y="66" width="150" height="344" fill="#FFFFFF" stroke="#E5E7EB"/>
  <g font-size="11" fill="#374151">
    <text x="452" y="88" font-weight="700">Properties</text>
    <text x="452" y="114" fill="#6B7280">位置 / 尺寸</text>
    <rect x="452" y="120" width="60" height="18" rx="3" fill="#F3F4F6"/><text x="458" y="133">W 320</text>
    <rect x="518" y="120" width="60" height="18" rx="3" fill="#F3F4F6"/><text x="524" y="133">H 48</text>
    <text x="452" y="162" fill="#6B7280">Layout</text>
    <rect x="452" y="168" width="126" height="18" rx="3" fill="#F3F4F6"/><text x="458" y="181">horizontal · gap 8</text>
    <text x="452" y="210" fill="#6B7280">Fill</text>
    <rect x="452" y="216" width="18" height="18" rx="3" fill="#2563EB"/><text x="476" y="229">#2563EB</text>
    <text x="452" y="258" fill="#6B7280">Stroke</text>
    <text x="452" y="290" fill="#6B7280">Effects</text>
  </g>
  <!-- canvas -->
  <rect x="160" y="66" width="280" height="344" fill="#F3F4F6"/>
  <rect x="200" y="100" width="200" height="270" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <text x="204" y="94" font-size="10" fill="#6B7280">登入頁</text>
  <rect x="220" y="130" width="120" height="14" rx="3" fill="#D1D5DB"/>
  <rect x="220" y="170" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="220" y="212" width="160" height="30" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="220" y="262" width="160" height="34" rx="8" fill="#2563EB" stroke="#2563EB" stroke-width="3" stroke-opacity="0.35"/>
  <text x="300" y="284" font-size="12" fill="#FFFFFF" text-anchor="middle">登入</text>

  <!-- numbered badges -->
  <g font-size="13" font-weight="700" fill="#FFFFFF" text-anchor="middle">
    <circle cx="230" cy="48" r="12" fill="#F59E0B"/><text x="230" y="53">1</text>
    <circle cx="140" cy="88" r="12" fill="#F59E0B"/><text x="140" y="93">2</text>
    <circle cx="420" cy="390" r="12" fill="#F59E0B"/><text x="420" y="395">3</text>
    <circle cx="570" cy="88" r="12" fill="#F59E0B"/><text x="570" y="93">4</text>
  </g>

  <!-- legend -->
  <g font-size="13" fill="#111827">
    <circle cx="622" cy="60" r="11" fill="#F59E0B"/><text x="622" y="65" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="642" y="58" font-weight="700">Home 與文件分頁</text>
    <text x="642" y="76" font-size="12" fill="#6B7280">開檔、切換 .pen 檔</text>

    <circle cx="622" cy="120" r="11" fill="#F59E0B"/><text x="622" y="125" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="642" y="118" font-weight="700">Layers 圖層面板</text>
    <text x="642" y="136" font-size="12" fill="#6B7280">看結構、改名、排順序</text>

    <circle cx="622" cy="180" r="11" fill="#F59E0B"/><text x="622" y="185" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="642" y="178" font-weight="700">無限畫布</text>
    <text x="642" y="196" font-size="12" fill="#6B7280">選取、拖曳、縮放</text>

    <circle cx="622" cy="240" r="11" fill="#F59E0B"/><text x="622" y="245" font-size="12" font-weight="700" fill="#FFFFFF" text-anchor="middle">4</text>
    <text x="642" y="238" font-weight="700">Properties 屬性面板</text>
    <text x="642" y="256" font-size="12" fill="#6B7280">選到什麼就改什麼</text>

    <rect x="610" y="290" width="170" height="106" rx="10" fill="#F3F4F6"/>
    <text x="622" y="314" font-weight="700">隨叫隨出</text>
    <text x="622" y="340" font-size="12">AI 對話　Cmd/Ctrl + K</text>
    <text x="622" y="362" font-size="12">指令面板　Cmd/Ctrl + P</text>
    <text x="622" y="384" font-size="12">找圖層　Cmd/Ctrl + F</text>
  </g>
</svg>
