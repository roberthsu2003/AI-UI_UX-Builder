<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="400" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- horizontal -->
  <text x="40" y="42" font-size="16" font-weight="700" fill="#111827">layout: horizontal（橫排）</text>
  <rect x="40" y="70" width="420" height="140" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="64" y="94" width="372" height="92" fill="#FFFFFF" stroke="#F59E0B" stroke-dasharray="4 3"/>
  <rect x="64" y="94" width="100" height="60" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <rect x="188" y="94" width="100" height="92" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <rect x="312" y="94" width="100" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <g font-size="12" fill="#1D4ED8" text-anchor="middle">
    <text x="114" y="128">A</text><text x="238" y="144">B</text><text x="362" y="120">C</text>
  </g>
  <rect x="164" y="160" width="24" height="16" fill="#FCA5A5" opacity="0.8"/>
  <rect x="288" y="160" width="24" height="16" fill="#FCA5A5" opacity="0.8"/>
  <text x="176" y="200" font-size="11" fill="#B91C1C" text-anchor="middle">gap</text>
  <text x="300" y="200" font-size="11" fill="#B91C1C" text-anchor="middle">gap</text>
  <text x="44" y="88" font-size="11" fill="#B45309">padding</text>
  <path d="M64 232 H440" stroke="#2563EB" stroke-width="2" marker-end="url(#m)"/>
  <text x="64" y="252" font-size="12" fill="#2563EB">主軸（排列方向）→ justifyContent 控制</text>
  <path d="M476 94 V190" stroke="#2563EB" stroke-width="2" marker-end="url(#m)"/>
  <text x="470" y="88" font-size="12" fill="#2563EB" text-anchor="end"></text>
  <text x="488" y="130" font-size="12" fill="#2563EB">交錯軸</text>
  <text x="488" y="148" font-size="12" fill="#2563EB">alignItems</text>
  <text x="488" y="166" font-size="12" fill="#2563EB">控制</text>

  <!-- vertical -->
  <text x="590" y="42" font-size="16" font-weight="700" fill="#111827">vertical（直排）</text>
  <rect x="590" y="70" width="170" height="210" rx="10" fill="#FEF3C7" stroke="#F59E0B"/>
  <rect x="610" y="90" width="110" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <rect x="610" y="150" width="130" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <rect x="610" y="210" width="80" height="44" rx="6" fill="#DBEAFE" stroke="#2563EB"/>
  <g font-size="12" fill="#1D4ED8" text-anchor="middle">
    <text x="665" y="117">A</text><text x="675" y="177">B</text><text x="650" y="237">C</text>
  </g>
  <path d="M600 300 V300" stroke="none"/>
  <path d="M774 90 V258" stroke="#2563EB" stroke-width="2" marker-end="url(#m)"/>
  <text x="590" y="304" font-size="12" fill="#2563EB">主軸變成由上到下</text>

  <!-- justify options -->
  <text x="40" y="300" font-size="14" font-weight="700" fill="#111827">justifyContent 的效果（橫排時）</text>
  <g font-size="11" fill="#374151">
    <rect x="40" y="316" width="120" height="28" rx="4" fill="#F3F4F6"/>
    <rect x="44" y="322" width="18" height="16" fill="#2563EB"/><rect x="66" y="322" width="18" height="16" fill="#2563EB"/>
    <text x="100" y="362" text-anchor="middle">start</text>
    <rect x="176" y="316" width="120" height="28" rx="4" fill="#F3F4F6"/>
    <rect x="214" y="322" width="18" height="16" fill="#2563EB"/><rect x="236" y="322" width="18" height="16" fill="#2563EB"/>
    <text x="236" y="362" text-anchor="middle">center</text>
    <rect x="312" y="316" width="120" height="28" rx="4" fill="#F3F4F6"/>
    <rect x="388" y="322" width="18" height="16" fill="#2563EB"/><rect x="410" y="322" width="18" height="16" fill="#2563EB"/>
    <text x="372" y="362" text-anchor="middle">end</text>
    <rect x="448" y="316" width="120" height="28" rx="4" fill="#F3F4F6"/>
    <rect x="452" y="322" width="18" height="16" fill="#2563EB"/><rect x="546" y="322" width="18" height="16" fill="#2563EB"/>
    <text x="508" y="362" text-anchor="middle">space_between</text>
    <rect x="584" y="316" width="120" height="28" rx="4" fill="#F3F4F6"/>
    <rect x="606" y="322" width="18" height="16" fill="#2563EB"/><rect x="664" y="322" width="18" height="16" fill="#2563EB"/>
    <text x="644" y="362" text-anchor="middle">space_around</text>
  </g>
  <text x="40" y="388" font-size="12" fill="#6B7280">alignItems 只有 start / center / end，沒有 stretch：要撐滿請把子元素尺寸設成 fill_container。</text>
</svg>
