<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">寬度的三種設定：父層變寬時，子元素會怎樣？</text>

  <g font-size="13">
    <text x="40" y="84" fill="#6B7280">父層 480 寬</text>
    <text x="420" y="84" fill="#6B7280">父層拉寬到 720 →</text>
  </g>

  <!-- row labels -->
  <g font-size="14" font-weight="700" fill="#111827">
    <text x="40" y="128">Fixed</text>
    <text x="40" y="198">Hug</text>
    <text x="40" y="268">Fill</text>
  </g>
  <g font-size="11" fill="#6B7280">
    <text x="40" y="146">寫死 160</text>
    <text x="40" y="216">fit_content</text>
    <text x="40" y="286">fill_container</text>
  </g>

  <!-- narrow parent -->
  <g>
    <rect x="130" y="104" width="250" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="138" y="112" width="160" height="32" rx="4" fill="#2563EB"/>
    <text x="218" y="133" font-size="12" fill="#FFFFFF" text-anchor="middle">160</text>

    <rect x="130" y="174" width="250" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="138" y="182" width="92" height="32" rx="4" fill="#F59E0B"/>
    <text x="184" y="203" font-size="12" fill="#FFFFFF" text-anchor="middle">立即報名</text>

    <rect x="130" y="244" width="250" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="138" y="252" width="234" height="32" rx="4" fill="#10B981"/>
    <text x="255" y="273" font-size="12" fill="#FFFFFF" text-anchor="middle">撐滿</text>
  </g>

  <!-- wide parent -->
  <g>
    <rect x="420" y="104" width="350" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="428" y="112" width="160" height="32" rx="4" fill="#2563EB"/>
    <text x="508" y="133" font-size="12" fill="#FFFFFF" text-anchor="middle">還是 160</text>

    <rect x="420" y="174" width="350" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="428" y="182" width="92" height="32" rx="4" fill="#F59E0B"/>
    <text x="474" y="203" font-size="12" fill="#FFFFFF" text-anchor="middle">立即報名</text>
    <text x="532" y="203" font-size="11" fill="#6B7280">跟著內容，不受父層影響</text>

    <rect x="420" y="244" width="350" height="48" rx="6" fill="#F3F4F6" stroke="#D1D5DB"/>
    <rect x="428" y="252" width="334" height="32" rx="4" fill="#10B981"/>
    <text x="595" y="273" font-size="12" fill="#FFFFFF" text-anchor="middle">跟著父層一起變寬 ✔ RWD 的關鍵</text>
  </g>

  <text x="40" y="322" font-size="12" fill="#6B7280">pen.dev 沒有百分比寬度（不能寫 100%），要填滿就用 fill_container；好幾個子元素都設 Fill 時會平分剩餘空間。</text>
</svg>
