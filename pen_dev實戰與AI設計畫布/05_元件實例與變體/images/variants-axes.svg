<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">variants：一個按鈕元件，兩個「軸」</text>
  <text x="40" y="66" font-size="13" fill="#6B7280">每個軸是一個可切換的屬性；每一格是一個變體（variant）。</text>

  <!-- dashed variants frame -->
  <rect x="150" y="86" width="430" height="210" rx="12" fill="none" stroke="#7C3AED" stroke-dasharray="6 4"/>
  <text x="160" y="104" font-size="11" fill="#7C3AED">variants 節點「Button」（虛線框）</text>

  <!-- column headers: state -->
  <g font-size="13" font-weight="700" fill="#111827" text-anchor="middle">
    <text x="245" y="134">default</text>
    <text x="375" y="134">hover</text>
    <text x="505" y="134">disabled</text>
  </g>
  <text x="375" y="320" font-size="12" fill="#7C3AED" text-anchor="middle">軸 state →</text>
  <!-- row headers: style -->
  <g font-size="13" font-weight="700" fill="#111827" text-anchor="end">
    <text x="136" y="183">primary</text>
    <text x="136" y="253">secondary</text>
  </g>
  <text x="40" y="320" font-size="12" fill="#7C3AED">↑ 軸 style</text>

  <!-- primary row -->
  <rect x="190" y="156" width="110" height="40" rx="8" fill="#2563EB"/>
  <rect x="320" y="156" width="110" height="40" rx="8" fill="#1D4ED8"/>
  <rect x="450" y="156" width="110" height="40" rx="8" fill="#BFDBFE"/>
  <g font-size="13" text-anchor="middle">
    <text x="245" y="181" fill="#FFFFFF">立即報名</text>
    <text x="375" y="181" fill="#FFFFFF">立即報名</text>
    <text x="505" y="181" fill="#FFFFFF">立即報名</text>
  </g>
  <!-- secondary row -->
  <rect x="190" y="226" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#2563EB"/>
  <rect x="320" y="226" width="110" height="40" rx="8" fill="#EFF6FF" stroke="#2563EB"/>
  <rect x="450" y="226" width="110" height="40" rx="8" fill="#FFFFFF" stroke="#BFDBFE"/>
  <g font-size="13" text-anchor="middle">
    <text x="245" y="251" fill="#2563EB">了解更多</text>
    <text x="375" y="251" fill="#2563EB">了解更多</text>
    <text x="505" y="251" fill="#93C5FD">了解更多</text>
  </g>

  <!-- instance panel -->
  <rect x="610" y="86" width="160" height="210" rx="12" fill="#F3F4F6"/>
  <text x="626" y="112" font-size="13" font-weight="700" fill="#111827">選取一個實例時</text>
  <text x="626" y="132" font-size="12" fill="#6B7280">屬性面板出現下拉選單</text>
  <g font-size="12" fill="#111827">
    <text x="626" y="162">style</text>
    <rect x="626" y="168" width="128" height="26" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="636" y="186">primary</text><text x="742" y="186" text-anchor="end">▾</text>
    <text x="626" y="218">state</text>
    <rect x="626" y="224" width="128" height="26" rx="6" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="636" y="242">hover</text><text x="742" y="242" text-anchor="end">▾</text>
  </g>
  <text x="626" y="276" font-size="11" fill="#6B7280">切換＝換成另一格的樣子</text>
</svg>
