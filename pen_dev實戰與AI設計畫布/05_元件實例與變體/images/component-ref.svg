<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#7C3AED"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- main component -->
  <text x="40" y="34" font-size="16" font-weight="700" fill="#111827">主元件（reusable: true）</text>
  <rect x="40" y="64" width="200" height="200" rx="14" fill="#FFFFFF" stroke="#7C3AED" stroke-width="2"/>
  <path d="M52 52 l6 -6 l6 6 l-6 6 z" fill="#7C3AED"/>
  <text x="70" y="57" font-size="11" fill="#7C3AED">CourseCard</text>
  <rect x="56" y="80" width="168" height="80" rx="8" fill="#E5E7EB"/>
  <text x="56" y="186" font-size="14" font-weight="700" fill="#111827">課程名稱</text>
  <text x="56" y="208" font-size="12" fill="#6B7280">講師名稱</text>
  <rect x="56" y="222" width="80" height="28" rx="6" fill="#7C3AED"/>
  <text x="96" y="241" font-size="12" fill="#FFFFFF" text-anchor="middle">查看</text>
  <text x="40" y="292" font-size="12" fill="#374151">改這裡 → 所有實例一起變</text>
  <text x="40" y="312" font-size="12" fill="#374151">（例如按鈕顏色、圓角）</text>

  <!-- arrows -->
  <g stroke="#7C3AED" stroke-width="2" fill="none" marker-end="url(#m)">
    <path d="M246 120 C290 120 300 100 330 100"/>
    <path d="M246 164 H330"/>
    <path d="M246 208 C290 208 300 228 330 228"/>
  </g>
  <text x="252" y="300" font-size="12" fill="#7C3AED">ref（實例）</text>

  <!-- instances -->
  <g font-size="12">
    <rect x="336" y="72" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
    <text x="350" y="96" font-weight="700" fill="#111827">Figma 入門</text>
    <text x="350" y="116" fill="#6B7280">王小明</text>

    <rect x="336" y="136" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
    <text x="350" y="160" font-weight="700" fill="#111827">RWD 網頁設計</text>
    <text x="350" y="180" fill="#6B7280">陳美玲</text>

    <rect x="336" y="200" width="140" height="56" rx="10" fill="#FFFFFF" stroke="#C4B5FD"/>
    <text x="350" y="224" font-weight="700" fill="#111827">AI 原型實作</text>
    <text x="350" y="244" fill="#6B7280">林大華</text>
  </g>

  <!-- override explanation -->
  <rect x="510" y="64" width="250" height="250" rx="12" fill="#F5F3FF"/>
  <text x="528" y="94" font-size="14" font-weight="700" fill="#111827">實例可以「覆寫」部分內容</text>
  <g font-size="12" fill="#374151">
    <text x="528" y="124">✔ 改文字、換圖片、換圖示</text>
    <text x="528" y="146">✔ 改某個子元素的顏色</text>
    <text x="528" y="168">✔ 隱藏某個子元素</text>
    <text x="528" y="198" fill="#6B7280">覆寫只影響這一個實例，</text>
    <text x="528" y="216" fill="#6B7280">其他沒覆寫的屬性仍跟主元件同步。</text>
    <text x="528" y="246" fill="#6B7280">AI 讀到的是 descendants：</text>
    <text x="528" y="266" font-family="Menlo,monospace" font-size="11" fill="#5B21B6">{ "Title": { content: "Figma 入門" } }</text>
    <text x="528" y="296" fill="#6B7280">脫離關係：Cmd/Ctrl + Option/Alt + X</text>
  </g>
</svg>
