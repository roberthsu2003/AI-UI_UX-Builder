<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <filter id="sh" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#0F172A" flood-opacity="0.18"/></filter>
    <filter id="inner" x="0" y="0" width="100%" height="100%">
      <feComponentTransfer in="SourceAlpha"><feFuncA type="table" tableValues="1 0"/></feComponentTransfer>
      <feGaussianBlur stdDeviation="5"/><feOffset dx="0" dy="4" result="o"/>
      <feFlood flood-color="#0F172A" flood-opacity="0.5"/><feComposite in2="o" operator="in"/>
      <feComposite in2="SourceAlpha" operator="in"/>
      <feMerge><feMergeNode in="SourceGraphic"/><feMergeNode/></feMerge>
    </filter>
    <filter id="bl" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="10"/></filter>
    <filter id="bgbl" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="6"/></filter>
    <clipPath id="glass"><rect x="560" y="96" width="170" height="80" rx="14"/></clipPath>
  </defs>
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">四種效果（effect）</text>

  <!-- drop shadow -->
  <rect x="40" y="80" width="150" height="100" rx="14" fill="#FFFFFF" stroke="#E5E7EB" filter="url(#sh)"/>
  <path d="M115 180 V200" stroke="#F59E0B" stroke-dasharray="3 2"/>
  <text x="122" y="198" font-size="11" fill="#B45309">offset y 12</text>
  <text x="40" y="230" font-size="14" font-weight="700" fill="#111827">shadow（outer）</text>
  <text x="40" y="250" font-size="12" fill="#6B7280">offset 位移、blur 模糊、color</text>
  <text x="40" y="268" font-size="12" fill="#6B7280">卡片浮起來的感覺</text>

  <!-- inner shadow -->
  <rect x="230" y="80" width="150" height="100" rx="14" fill="#F3F4F6" stroke="#E5E7EB" filter="url(#inner)"/>
  <text x="230" y="230" font-size="14" font-weight="700" fill="#111827">shadow（inner）</text>
  <text x="230" y="250" font-size="12" fill="#6B7280">向內凹陷</text>
  <text x="230" y="268" font-size="12" fill="#6B7280">輸入框、按下的按鈕</text>

  <!-- blur -->
  <circle cx="480" cy="130" r="40" fill="#60A5FA" filter="url(#bl)"/>
  <circle cx="500" cy="120" r="24" fill="#F472B6" filter="url(#bl)"/>
  <text x="420" y="230" font-size="14" font-weight="700" fill="#111827">blur</text>
  <text x="420" y="250" font-size="12" fill="#6B7280">節點本身變模糊</text>
  <text x="420" y="268" font-size="12" fill="#6B7280">背景光暈</text>

  <!-- background blur -->
  <g>
    <circle cx="600" cy="92" r="30" fill="#F59E0B"/>
    <rect x="660" y="70" width="70" height="60" rx="6" fill="#2563EB"/>
    <g clip-path="url(#glass)">
      <g filter="url(#bgbl)">
        <circle cx="600" cy="92" r="30" fill="#F59E0B"/>
        <rect x="660" y="70" width="70" height="60" rx="6" fill="#2563EB"/>
      </g>
      <rect x="560" y="96" width="170" height="80" fill="#FFFFFF" fill-opacity="0.55"/>
    </g>
    <rect x="560" y="96" width="170" height="80" rx="14" fill="none" stroke="#D1D5DB"/>
    <text x="645" y="150" font-size="13" font-weight="700" fill="#111827" text-anchor="middle">毛玻璃卡片</text>
  </g>
  <text x="560" y="230" font-size="14" font-weight="700" fill="#111827">background_blur</text>
  <text x="560" y="250" font-size="12" fill="#6B7280">模糊「後面」的東西</text>
  <text x="560" y="268" font-size="12" fill="#6B7280">要搭配半透明填色才看得到</text>

  <text x="40" y="314" font-size="12" fill="#6B7280">shadow 有外陰影、內陰影兩種；第四種 shader 效果用程式後製整個節點（例如像素化），屬於進階用法。效果可以疊加。</text>
</svg>
