<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="330" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">Generate：該用哪一種？</text>

  <!-- new content -->
  <text x="40" y="76" font-size="14" font-weight="700" fill="#2563EB">產生新的東西</text>
  <g font-size="12">
    <rect x="40" y="88" width="230" height="74" rx="10" fill="#EFF6FF"/>
    <text x="56" y="112" font-weight="700" fill="#111827" font-family="Menlo,monospace">stock</text>
    <text x="56" y="132" fill="#374151">從 Unsplash 找真實照片</text>
    <text x="56" y="150" fill="#6B7280">關鍵字 1～3 個英文單字最準</text>

    <rect x="285" y="88" width="230" height="74" rx="10" fill="#EFF6FF"/>
    <text x="301" y="112" font-weight="700" fill="#111827" font-family="Menlo,monospace">ai</text>
    <text x="301" y="132" fill="#374151">AI 生成插畫或攝影</text>
    <text x="301" y="150" fill="#6B7280">提示詞寫越具體越好</text>

    <rect x="530" y="88" width="230" height="74" rx="10" fill="#EFF6FF"/>
    <text x="546" y="112" font-weight="700" fill="#111827" font-family="Menlo,monospace">svg</text>
    <text x="546" y="132" fill="#374151">AI 畫可編輯的向量圖（Logo）</text>
    <text x="546" y="150" fill="#6B7280">最慢最貴，做成元件重複用</text>
  </g>

  <!-- transform -->
  <text x="40" y="198" font-size="14" font-weight="700" fill="#B45309">處理已經在畫布上的圖片</text>
  <g font-size="12">
    <rect x="40" y="210" width="230" height="74" rx="10" fill="#FEF3C7"/>
    <text x="56" y="234" font-weight="700" fill="#111827" font-family="Menlo,monospace">remove-background</text>
    <text x="56" y="254" fill="#374151">去背，只留主體</text>
    <text x="56" y="272" fill="#6B7280">講師照、商品照</text>

    <rect x="285" y="210" width="230" height="74" rx="10" fill="#FEF3C7"/>
    <text x="301" y="234" font-weight="700" fill="#111827" font-family="Menlo,monospace">replace-background</text>
    <text x="301" y="254" fill="#374151">保留主體，換一個背景</text>
    <text x="301" y="272" fill="#6B7280">統一多張照片的風格</text>

    <rect x="530" y="210" width="230" height="74" rx="10" fill="#FEF3C7"/>
    <text x="546" y="234" font-weight="700" fill="#111827" font-family="Menlo,monospace">vectorize-image</text>
    <text x="546" y="254" fill="#374151">點陣圖轉向量路徑</text>
    <text x="546" y="272" fill="#6B7280">只適合 Logo、扁平插圖</text>
  </g>
  <text x="40" y="310" font-size="12" fill="#6B7280">圖示用 icon 節點、色塊用形狀與漸層，都不需要 Generate。需要登入 pen.dev 帳號，結果會晚幾秒到幾分鐘才出現。</text>
</svg>
