<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">同一個版面：pen.dev 的 Flex 對應到 PyQt 的 Layout</text>

  <!-- design -->
  <text x="40" y="76" font-size="13" font-weight="700" fill="#2563EB">pen.dev 設計稿</text>
  <rect x="40" y="88" width="300" height="190" rx="8" fill="#F9FAFB" stroke="#2563EB"/>
  <text x="46" y="102" font-size="10" fill="#2563EB">AppShell · horizontal · gap 0</text>
  <rect x="48" y="108" width="70" height="162" rx="4" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="54" y="124" font-size="9" fill="#2563EB">Sidebar</text>
  <text x="54" y="136" font-size="9" fill="#6B7280">vertical</text>
  <text x="54" y="148" font-size="9" fill="#6B7280">寬 220 固定</text>
  <rect x="126" y="108" width="206" height="162" rx="4" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="132" y="124" font-size="9" fill="#2563EB">Content · vertical · padding 32 · Fill</text>
  <rect x="134" y="134" width="190" height="56" rx="4" fill="#EFF6FF" stroke="#93C5FD"/>
  <text x="140" y="148" font-size="9" fill="#2563EB">KPI Row · horizontal · gap 24</text>
  <g fill="#FFFFFF" stroke="#93C5FD"><rect x="140" y="154" width="56" height="30" rx="3"/><rect x="201" y="154" width="56" height="30" rx="3"/><rect x="262" y="154" width="56" height="30" rx="3"/></g>
  <text x="146" y="173" font-size="8" fill="#6B7280">StatCard</text>

  <path d="M350 183 H400" stroke="#6B7280" stroke-width="2" marker-end="url(#m)"/>

  <!-- code tree -->
  <text x="412" y="76" font-size="13" font-weight="700" fill="#059669">PyQt6 程式結構</text>
  <rect x="412" y="88" width="350" height="190" rx="8" fill="#111827"/>
  <g font-family="Menlo,monospace" font-size="11" fill="#E5E7EB">
    <text x="426" y="112">QHBoxLayout <tspan fill="#9CA3AF">setSpacing(0)</tspan></text>
    <text x="444" y="134">├ Sidebar <tspan fill="#9CA3AF">setFixedWidth(220)</tspan></text>
    <text x="462" y="152">└ QVBoxLayout</text>
    <text x="444" y="174">└ Content <tspan fill="#86EFAC">addWidget(…, 1)</tspan></text>
    <text x="462" y="192">└ QVBoxLayout <tspan fill="#9CA3AF">margins 32</tspan></text>
    <text x="480" y="214">└ QHBoxLayout <tspan fill="#9CA3AF">spacing 24</tspan></text>
    <text x="498" y="236">└ StatCard × 3 <tspan fill="#86EFAC">stretch 1</tspan></text>
    <text x="426" y="262" fill="#9CA3AF">setStyleSheet(QSS ← 變數)</text>
  </g>

  <text x="40" y="314" font-size="13" fill="#374151"><tspan font-weight="700">記法：</tspan>horizontal → QHBoxLayout、vertical → QVBoxLayout、gap → setSpacing、padding → setContentsMargins、</text>
  <text x="40" y="336" font-size="13" fill="#374151">fill_container → stretch 1、固定寬 → setFixedWidth、圖層名稱 → objectName（QSS 用 #名稱 指定）。</text>
</svg>
