<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 330" width="800" height="330" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="330" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">text 的三種 textGrowth：誰決定文字框的大小？</text>

  <!-- auto -->
  <text x="40" y="84" font-size="15" font-weight="700" fill="#2563EB">auto（預設）</text>
  <text x="40" y="104" font-size="12" fill="#6B7280">寬高都跟著字數，永遠不換行</text>
  <rect x="40" y="124" width="196" height="32" fill="none" stroke="#2563EB" stroke-dasharray="4 3"/>
  <text x="46" y="146" font-size="15" fill="#111827">立即免費試用 14 天</text>
  <text x="40" y="184" font-size="12" fill="#111827">✔ 適合：按鈕文字、標籤</text>
  <text x="40" y="204" font-size="12" fill="#DC2626">✘ 長句會一路往右延伸</text>

  <!-- fixed-width -->
  <text x="290" y="84" font-size="15" font-weight="700" fill="#2563EB">fixed-width（最常用）</text>
  <text x="290" y="104" font-size="12" fill="#6B7280">寬度固定，自動換行，高度跟著長</text>
  <rect x="290" y="124" width="200" height="82" fill="none" stroke="#2563EB" stroke-dasharray="4 3"/>
  <text x="296" y="146" font-size="14" fill="#111827">我們協助小團隊把想法</text>
  <text x="296" y="170" font-size="14" fill="#111827">快速做成原型，再交給</text>
  <text x="296" y="194" font-size="14" fill="#111827">工程師開發。</text>
  <path d="M500 124 V206" stroke="#9CA3AF"/>
  <text x="506" y="170" font-size="11" fill="#6B7280">高度↕自動</text>
  <text x="290" y="232" font-size="12" fill="#111827">✔ 適合：段落、標題、說明文字</text>
  <text x="290" y="252" font-size="12" fill="#111827">搭配寬度設 fill_container 最好用</text>

  <!-- fixed-width-height -->
  <text x="580" y="84" font-size="15" font-weight="700" fill="#2563EB">fixed-width-height</text>
  <text x="580" y="104" font-size="12" fill="#6B7280">寬高都固定，字太多會溢出</text>
  <rect x="580" y="124" width="180" height="56" fill="none" stroke="#2563EB" stroke-dasharray="4 3"/>
  <text x="586" y="146" font-size="14" fill="#111827">我們協助小團隊把想法</text>
  <text x="586" y="170" font-size="14" fill="#111827">快速做成原型，再交給</text>
  <text x="586" y="194" font-size="14" fill="#DC2626">工程師開發。← 溢出</text>
  <text x="580" y="232" font-size="12" fill="#111827">只在非固定高度不可時用</text>

  <rect x="40" y="274" width="720" height="38" rx="10" fill="#FEF2F2"/>
  <text x="56" y="298" font-size="13" fill="#991B1B"><tspan font-weight="700">新手陷阱：</tspan>text 預設沒有顏色（fill），沒設定會「看不見」。AI 產生的文字消失時，先檢查 fill。</text>
</svg>
