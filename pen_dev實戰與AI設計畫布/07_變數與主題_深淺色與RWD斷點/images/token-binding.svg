<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 320" width="800" height="320" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#2563EB"/>
    </marker>
  </defs>
  <rect width="800" height="320" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">變數：定義一次，到處引用，改一次全部更新</text>

  <!-- variable -->
  <rect x="40" y="110" width="200" height="100" rx="12" fill="#EFF6FF" stroke="#2563EB" stroke-width="2"/>
  <text x="58" y="140" font-size="13" fill="#6B7280">變數（color）</text>
  <text x="58" y="168" font-size="20" font-weight="700" fill="#111827" font-family="Menlo,monospace">primary</text>
  <rect x="58" y="180" width="18" height="18" rx="4" fill="#2563EB"/>
  <text x="84" y="194" font-size="13" fill="#374151" font-family="Menlo,monospace">#2563EB</text>

  <g stroke="#2563EB" stroke-width="2" fill="none" marker-end="url(#m)">
    <path d="M244 140 C300 140 310 90 360 90"/>
    <path d="M244 160 H360"/>
    <path d="M244 180 C300 180 310 230 360 230"/>
  </g>
  <text x="262" y="270" font-size="12" fill="#2563EB" font-family="Menlo,monospace">fill: "$primary"</text>

  <!-- consumers -->
  <rect x="366" y="72" width="110" height="36" rx="8" fill="#2563EB"/>
  <text x="421" y="95" font-size="13" fill="#FFFFFF" text-anchor="middle">立即報名</text>
  <text x="490" y="95" font-size="12" fill="#6B7280">按鈕底色</text>
  <rect x="366" y="142" width="110" height="36" rx="8" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="421" y="165" font-size="13" fill="#2563EB" text-anchor="middle">featured</text>
  <text x="490" y="165" font-size="12" fill="#6B7280">卡片框線</text>
  <text x="366" y="236" font-size="16" font-weight="700" fill="#2563EB">LearnHub</text>
  <text x="490" y="236" font-size="12" fill="#6B7280">Logo 文字顏色</text>

  <!-- css -->
  <rect x="600" y="72" width="170" height="170" rx="12" fill="#111827"/>
  <text x="616" y="98" font-size="12" fill="#9CA3AF">轉成 CSS 後</text>
  <g font-family="Menlo,monospace" font-size="11" fill="#E5E7EB">
    <text x="616" y="126">:root {</text>
    <text x="628" y="144" fill="#93C5FD">--primary: #2563EB;</text>
    <text x="616" y="162">}</text>
    <text x="616" y="192">.btn {</text>
    <text x="628" y="210">background:</text>
    <text x="640" y="228" fill="#93C5FD">var(--primary);</text>
  </g>
  <text x="616" y="236" font-size="11" fill="#E5E7EB"></text>
</svg>
