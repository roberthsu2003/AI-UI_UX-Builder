<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 400" width="800" height="400" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="400" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">主題軸：同一個變數，依主題給不同的值</text>

  <!-- mode table -->
  <text x="40" y="78" font-size="14" font-weight="700" fill="#111827">軸 mode（深淺色）</text>
  <g font-size="12">
    <rect x="40" y="90" width="340" height="30" fill="#F3F4F6"/>
    <text x="52" y="110" font-weight="700" fill="#374151">變數</text>
    <text x="180" y="110" font-weight="700" fill="#374151">light</text>
    <text x="280" y="110" font-weight="700" fill="#374151">dark</text>
    <g font-family="Menlo,monospace" fill="#111827">
      <text x="52" y="142">surface</text><text x="52" y="172">text</text><text x="52" y="202">border</text>
    </g>
    <rect x="180" y="130" width="16" height="16" rx="3" fill="#FFFFFF" stroke="#D1D5DB"/><text x="202" y="142" fill="#374151">#FFFFFF</text>
    <rect x="280" y="130" width="16" height="16" rx="3" fill="#0F172A"/><text x="302" y="142" fill="#374151">#0F172A</text>
    <rect x="180" y="160" width="16" height="16" rx="3" fill="#111827"/><text x="202" y="172" fill="#374151">#111827</text>
    <rect x="280" y="160" width="16" height="16" rx="3" fill="#F1F5F9" stroke="#D1D5DB"/><text x="302" y="172" fill="#374151">#F1F5F9</text>
    <rect x="180" y="190" width="16" height="16" rx="3" fill="#E5E7EB"/><text x="202" y="202" fill="#374151">#E5E7EB</text>
    <rect x="280" y="190" width="16" height="16" rx="3" fill="#334155"/><text x="302" y="202" fill="#374151">#334155</text>
  </g>

  <!-- device table -->
  <text x="420" y="78" font-size="14" font-weight="700" fill="#111827">軸 device（RWD 斷點）</text>
  <g font-size="12">
    <rect x="420" y="90" width="340" height="30" fill="#F3F4F6"/>
    <text x="432" y="110" font-weight="700" fill="#374151">變數</text>
    <text x="560" y="110" font-weight="700" fill="#374151">desktop</text>
    <text x="635" y="110" font-weight="700" fill="#374151">tablet</text>
    <text x="705" y="110" font-weight="700" fill="#374151">phone</text>
    <g font-family="Menlo,monospace" fill="#111827">
      <text x="432" y="142">size-h1</text><text x="432" y="172">space-section</text><text x="432" y="202">space-x</text>
    </g>
    <g fill="#374151">
      <text x="560" y="142">56</text><text x="635" y="142">44</text><text x="705" y="142">32</text>
      <text x="560" y="172">96</text><text x="635" y="172">64</text><text x="705" y="172">48</text>
      <text x="560" y="202">80</text><text x="635" y="202">40</text><text x="705" y="202">20</text>
    </g>
  </g>

  <!-- frames with theme -->
  <text x="40" y="250" font-size="14" font-weight="700" fill="#111827">在畫面 frame 上選主題，裡面所有 $變數 自動換值</text>
  <g>
    <rect x="40" y="266" width="220" height="110" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="52" y="288" font-size="11" fill="#6B7280">mode: light · device: desktop</text>
    <text x="52" y="324" font-size="26" font-weight="700" fill="#111827">大標題</text>
    <rect x="52" y="340" width="80" height="22" rx="6" fill="#2563EB"/>

    <rect x="290" y="266" width="220" height="110" rx="10" fill="#0F172A" stroke="#334155"/>
    <text x="302" y="288" font-size="11" fill="#94A3B8">mode: dark · device: desktop</text>
    <text x="302" y="324" font-size="26" font-weight="700" fill="#F1F5F9">大標題</text>
    <rect x="302" y="340" width="80" height="22" rx="6" fill="#3B82F6"/>

    <rect x="540" y="266" width="110" height="110" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="548" y="288" font-size="10" fill="#6B7280">light · phone</text>
    <text x="548" y="318" font-size="16" font-weight="700" fill="#111827">大標題</text>
    <rect x="548" y="332" width="94" height="22" rx="6" fill="#2563EB"/>
    <text x="664" y="314" font-size="11" fill="#374151">字變小、</text>
    <text x="664" y="332" font-size="11" fill="#374151">留白變少，</text>
    <text x="664" y="350" font-size="11" fill="#374151">不用逐一改</text>
  </g>
</svg>
