<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 380" width="800" height="380" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="380" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="44" font-size="18" font-weight="700" fill="#111827">你在畫布上看到的</text>
  <text x="440" y="44" font-size="18" font-weight="700" fill="#111827">.pen 檔案裡存的（節點樹）</text>

  <!-- canvas side -->
  <rect x="40" y="64" width="340" height="290" rx="12" fill="#F3F4F6"/>
  <rect x="80" y="100" width="260" height="220" rx="14" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <text x="84" y="94" font-size="12" fill="#2563EB">frame「Card」</text>
  <rect x="104" y="124" width="140" height="22" rx="4" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
  <text x="110" y="141" font-size="16" font-weight="700" fill="#111827">專業方案</text>
  <rect x="104" y="158" width="212" height="44" rx="4" fill="none" stroke="#9CA3AF" stroke-dasharray="4 3"/>
  <text x="110" y="176" font-size="13" fill="#4B5563">適合 5 人以下的小團隊，</text>
  <text x="110" y="195" font-size="13" fill="#4B5563">每月 NT$ 490。</text>
  <rect x="104" y="252" width="132" height="44" rx="10" fill="#2563EB"/>
  <text x="170" y="280" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">立即購買</text>

  <!-- tree side -->
  <g font-size="14" fill="#111827">
    <rect x="440" y="72" width="120" height="30" rx="6" fill="#F3F4F6"/>
    <text x="452" y="92">document</text>
    <path d="M460 102 V128 H484" fill="none" stroke="#9CA3AF"/>
    <rect x="484" y="114" width="250" height="30" rx="6" fill="#DBEAFE"/>
    <text x="496" y="134"><tspan font-weight="700">frame</tspan> Card · layout: vertical</text>
    <path d="M504 144 V170 H528 M504 170 V212 H528 M504 212 V254 H528" fill="none" stroke="#9CA3AF"/>
    <rect x="528" y="156" width="190" height="30" rx="6" fill="#F3F4F6"/>
    <text x="540" y="176"><tspan font-weight="700">text</tspan> 專業方案</text>
    <rect x="528" y="198" width="190" height="30" rx="6" fill="#F3F4F6"/>
    <text x="540" y="218"><tspan font-weight="700">text</tspan> 適合 5 人以下…</text>
    <rect x="528" y="240" width="190" height="30" rx="6" fill="#F3F4F6"/>
    <text x="540" y="260"><tspan font-weight="700">frame</tspan> Button</text>
    <path d="M548 270 V296 H572" fill="none" stroke="#9CA3AF"/>
    <rect x="572" y="282" width="160" height="30" rx="6" fill="#F3F4F6"/>
    <text x="584" y="302"><tspan font-weight="700">text</tspan> 立即購買</text>
  </g>
  <text x="440" y="346" font-size="13" fill="#6B7280">每個方框都是一個「節點」，有自己的屬性。</text>
  <text x="440" y="366" font-size="13" fill="#6B7280">你用滑鼠改、AI 用程式改，改的都是同一棵樹。</text>
</svg>
