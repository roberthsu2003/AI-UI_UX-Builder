<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">元件庫在畫布上怎麼擺：上面放元件，下面放頁面</text>

  <rect x="40" y="62" width="720" height="104" rx="12" fill="#F5F3FF" stroke="#C4B5FD" stroke-dasharray="6 4"/>
  <text x="56" y="86" font-size="13" font-weight="700" fill="#7C3AED">元件區（Components）</text>
  <g font-size="11" fill="#374151" text-anchor="middle">
    <rect x="56" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="104" y="129">Button</text>
    <rect x="164" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="212" y="129">TextField</text>
    <rect x="272" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="320" y="129">Navbar</text>
    <rect x="380" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="428" y="129">CourseCard</text>
    <rect x="488" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="536" y="129">PricingCard</text>
    <rect x="596" y="98" width="96" height="52" rx="8" fill="#FFFFFF" stroke="#C4B5FD"/><text x="644" y="129">Footer</text>
  </g>

  <text x="56" y="200" font-size="13" font-weight="700" fill="#2563EB">頁面區（Screens），往右、往下延伸</text>
  <rect x="56" y="214" width="300" height="106" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="66" y="232" font-size="11" fill="#2563EB">活動頁 - Desktop 1440</text>
  <g fill="#E5E7EB">
    <rect x="66" y="240" width="280" height="10" rx="2"/>
    <rect x="66" y="256" width="280" height="26" rx="3"/>
    <rect x="66" y="288" width="280" height="24" rx="3"/>
  </g>
  <rect x="376" y="214" width="130" height="106" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="386" y="232" font-size="11" fill="#2563EB">Tablet 768</text>
  <g fill="#E5E7EB"><rect x="386" y="240" width="110" height="10" rx="2"/><rect x="386" y="256" width="110" height="26" rx="3"/><rect x="386" y="288" width="110" height="24" rx="3"/></g>
  <rect x="526" y="214" width="70" height="106" rx="8" fill="#FFFFFF" stroke="#93C5FD"/>
  <text x="532" y="232" font-size="11" fill="#2563EB">Phone</text>
  <g fill="#E5E7EB"><rect x="534" y="240" width="54" height="10" rx="2"/><rect x="534" y="256" width="54" height="26" rx="3"/><rect x="534" y="288" width="54" height="24" rx="3"/></g>
  <text x="620" y="250" font-size="12" fill="#374151">頁面裡只放</text>
  <text x="620" y="268" font-size="12" fill="#374151">元件的「實例」，</text>
  <text x="620" y="286" font-size="12" fill="#374151">改元件區就會</text>
  <text x="620" y="304" font-size="12" fill="#374151">全部頁面同步。</text>
</svg>
