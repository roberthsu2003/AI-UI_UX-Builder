<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>

  <!-- strategy 1 -->
  <text x="40" y="42" font-size="16" font-weight="700" fill="#111827">做法一：同一個元件，寬度用 Fill 自己伸縮</text>
  <text x="40" y="62" font-size="12" fill="#6B7280">適合：Button、Input、Card、PricingCard（結構不變，只有寬度變）</text>
  <rect x="40" y="78" width="260" height="96" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="52" y="90" width="236" height="40" rx="6" fill="#E5E7EB"/>
  <rect x="52" y="140" width="120" height="10" rx="2" fill="#9CA3AF"/>
  <rect x="52" y="156" width="80" height="8" rx="2" fill="#D1D5DB"/>
  <text x="170" y="194" font-size="11" fill="#6B7280" text-anchor="middle">桌機：約 400 寬</text>
  <rect x="340" y="78" width="160" height="96" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="352" y="90" width="136" height="40" rx="6" fill="#E5E7EB"/>
  <rect x="352" y="140" width="100" height="10" rx="2" fill="#9CA3AF"/>
  <rect x="352" y="156" width="70" height="8" rx="2" fill="#D1D5DB"/>
  <text x="420" y="194" font-size="11" fill="#6B7280" text-anchor="middle">手機：撐滿 350 寬</text>
  <text x="530" y="120" font-size="12" fill="#10B981">✔ 只要一個元件</text>
  <text x="530" y="140" font-size="12" fill="#10B981">✔ 卡片寬度設 fill_container</text>
  <text x="530" y="160" font-size="12" fill="#10B981">✔ 內文用 fixed-width</text>

  <path d="M40 212 H760" stroke="#E5E7EB"/>

  <!-- strategy 2 -->
  <text x="40" y="244" font-size="16" font-weight="700" fill="#111827">做法二：結構不同，就做 device 變體</text>
  <text x="40" y="264" font-size="12" fill="#6B7280">適合：Navbar、Footer、Hero（手機上要換成不同排法）</text>
  <rect x="40" y="280" width="420" height="40" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <rect x="52" y="294" width="60" height="12" rx="2" fill="#111827"/>
  <g fill="#9CA3AF"><rect x="190" y="296" width="36" height="8" rx="2"/><rect x="236" y="296" width="36" height="8" rx="2"/><rect x="282" y="296" width="36" height="8" rx="2"/></g>
  <rect x="384" y="290" width="64" height="20" rx="6" fill="#2563EB"/>
  <text x="40" y="340" font-size="11" fill="#7C3AED">Navbar · device=desktop</text>
  <rect x="500" y="280" width="180" height="40" rx="8" fill="#FFFFFF" stroke="#7C3AED"/>
  <rect x="512" y="294" width="60" height="12" rx="2" fill="#111827"/>
  <g stroke="#111827" stroke-width="2"><path d="M650 293 H666 M650 300 H666 M650 307 H666"/></g>
  <text x="500" y="340" font-size="11" fill="#7C3AED">Navbar · device=phone</text>
  <text x="700" y="300" font-size="12" fill="#374151">切換下拉</text>
  <text x="700" y="318" font-size="12" fill="#374151">選單即可</text>
</svg>
