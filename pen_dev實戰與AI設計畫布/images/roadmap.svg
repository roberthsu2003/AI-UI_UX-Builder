<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="300" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">學習地圖：由淺至深，最後做出一個完整的 RWD 網站</text>

  <path d="M70 150 H730" stroke="#E5E7EB" stroke-width="6" stroke-linecap="round"/>

  <!-- stage labels -->
  <g font-size="13" font-weight="700">
    <rect x="40" y="66" width="190" height="28" rx="14" fill="#F3F4F6"/><text x="135" y="85" text-anchor="middle" fill="#374151">入門：會操作</text>
    <rect x="246" y="66" width="250" height="28" rx="14" fill="#DBEAFE"/><text x="371" y="85" text-anchor="middle" fill="#1D4ED8">核心：會做 RWD 元件與版面</text>
    <rect x="512" y="66" width="150" height="28" rx="14" fill="#DCFCE7"/><text x="587" y="85" text-anchor="middle" fill="#15803D">完成：變成網頁</text>
    <rect x="678" y="66" width="84" height="28" rx="14" fill="#FEF3C7"/><text x="720" y="85" text-anchor="middle" fill="#B45309">延伸</text>
  </g>

  <!-- nodes -->
  <g font-size="12" text-anchor="middle">
    <g fill="#9CA3AF"><circle cx="70" cy="150" r="16"/><circle cx="135" cy="150" r="16"/><circle cx="200" cy="150" r="16"/></g>
    <g fill="#2563EB"><circle cx="276" cy="150" r="16"/><circle cx="341" cy="150" r="16"/><circle cx="406" cy="150" r="22"/><circle cx="471" cy="150" r="16"/></g>
    <g fill="#16A34A"><circle cx="555" cy="150" r="16"/><circle cx="620" cy="150" r="22"/></g>
    <circle cx="720" cy="150" r="16" fill="#F59E0B"/>
    <g fill="#FFFFFF" font-weight="700">
      <text x="70" y="155">01</text><text x="135" y="155">02</text><text x="200" y="155">03</text>
      <text x="276" y="155">04</text><text x="341" y="155">05</text><text x="406" y="155">06</text><text x="471" y="155">07</text>
      <text x="555" y="155">08</text><text x="620" y="155">09</text><text x="720" y="155">10</text>
    </g>
  </g>
  <g font-size="12" fill="#111827" text-anchor="middle">
    <text x="70" y="196">認識</text><text x="135" y="196">介面</text><text x="200" y="196">形狀文字</text>
    <text x="276" y="196">Flex</text><text x="341" y="196">元件</text><text x="406" y="200" font-weight="700">元件庫</text><text x="471" y="196">變數主題</text>
    <text x="555" y="196">特效生圖</text><text x="620" y="200" font-weight="700">轉程式碼</text><text x="720" y="196">PyQt</text>
  </g>
  <g font-size="11" fill="#6B7280" text-anchor="middle">
    <text x="406" y="218">★ 主專案開始</text>
    <text x="620" y="218">★ RWD 網站完成</text>
  </g>
  <text x="40" y="272" font-size="12" fill="#6B7280">每一章都是：AI 先產生練習素材 → 你手動操作修改 → 選取＋便利貼交回 AI。範例以 RWD 網頁為主。</text>
</svg>
