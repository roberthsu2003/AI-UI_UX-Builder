<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <rect width="800" height="300" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">Artifacts 的範本類型：本單元用的是 Design</text>

  <g font-size="12" text-anchor="middle">
    <rect x="40" y="70" width="140" height="150" rx="14" fill="#FFF7ED" stroke="#D97757" stroke-width="3"/>
    <rect x="62" y="88" width="96" height="62" rx="6" fill="#FFFFFF" stroke="#F4B393"/>
    <rect x="70" y="96" width="80" height="20" rx="3" fill="#FDE7DC"/>
    <g fill="#E5E7EB"><rect x="70" y="122" width="24" height="20" rx="2"/><rect x="98" y="122" width="24" height="20" rx="2"/><rect x="126" y="122" width="24" height="20" rx="2"/></g>
    <text x="110" y="176" font-size="15" font-weight="700" fill="#C2410C">Design</text>
    <text x="110" y="196" fill="#374151">網頁、App、海報</text>
    <text x="110" y="212" fill="#374151">一頁式文宣</text>

    <rect x="196" y="70" width="120" height="150" rx="14" fill="#F3F4F6"/>
    <rect x="216" y="94" width="80" height="50" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <rect x="224" y="102" width="50" height="8" rx="2" fill="#9CA3AF"/>
    <text x="256" y="176" font-size="14" font-weight="700" fill="#111827">Slides</text>
    <text x="256" y="196" fill="#6B7280">簡報</text>

    <rect x="332" y="70" width="120" height="150" rx="14" fill="#F3F4F6"/>
    <rect x="362" y="88" width="60" height="70" rx="4" fill="#FFFFFF" stroke="#D1D5DB"/>
    <g fill="#D1D5DB"><rect x="370" y="98" width="44" height="5" rx="2"/><rect x="370" y="108" width="44" height="5" rx="2"/><rect x="370" y="118" width="34" height="5" rx="2"/></g>
    <text x="392" y="176" font-size="14" font-weight="700" fill="#111827">Docs</text>
    <text x="392" y="196" fill="#6B7280">文件、企劃書</text>

    <rect x="468" y="70" width="120" height="150" rx="14" fill="#F3F4F6"/>
    <g fill="#9CA3AF"><rect x="496" y="126" width="12" height="26" rx="2"/><rect x="514" y="110" width="12" height="42" rx="2"/><rect x="532" y="96" width="12" height="56" rx="2"/><rect x="550" y="116" width="12" height="36" rx="2"/></g>
    <text x="528" y="176" font-size="14" font-weight="700" fill="#111827">Data</text>
    <text x="528" y="196" fill="#6B7280">儀表板、數據頁</text>

    <rect x="604" y="70" width="156" height="150" rx="14" fill="#F9FAFB" stroke="#E5E7EB" stroke-dasharray="5 4"/>
    <text x="682" y="110" fill="#6B7280">Sheets（beta）</text>
    <text x="682" y="134" fill="#6B7280">Whiteboards（beta）</text>
    <text x="682" y="158" fill="#6B7280">Motion（beta）</text>
    <text x="682" y="196" font-size="11" fill="#9CA3AF">依方案開放</text>
  </g>
  <text x="40" y="256" font-size="13" fill="#374151">同一個對話裡可以混用：先用 Design 做活動頁，再請 Claude 把它整理成 Slides 簡報給老闆看。</text>
  <text x="40" y="278" font-size="12" fill="#6B7280">範本名稱與開放狀態以 Claude 畫面上顯示的為準。</text>
</svg>
