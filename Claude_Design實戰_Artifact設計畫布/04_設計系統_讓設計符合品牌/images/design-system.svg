<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="360" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">設計系統：建立一次，之後每個設計都自動套用</text>

  <g font-size="12">
    <text x="40" y="76" font-weight="700" fill="#6B7280">從哪裡建立</text>
    <rect x="40" y="88" width="200" height="60" rx="10" fill="#FFF7ED"/>
    <text x="56" y="112" font-size="13" font-weight="700" fill="#111827">在對話中上傳資料</text>
    <text x="56" y="132" fill="#6B7280">Logo、字型、品牌手冊、簡報</text>
    <rect x="40" y="158" width="200" height="60" rx="10" fill="#FFF7ED"/>
    <text x="56" y="182" font-size="13" font-weight="700" fill="#111827">Figma 檔或現有設計</text>
    <text x="56" y="202" fill="#6B7280">已經有的設計稿</text>
    <rect x="40" y="228" width="200" height="60" rx="10" fill="#FFF7ED"/>
    <text x="56" y="252" font-size="13" font-weight="700" fill="#111827">程式碼庫</text>
    <text x="56" y="272" fill="#6B7280" font-family="Menlo,monospace" font-size="11">Claude Code：/design-sync</text>
  </g>
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#m)">
    <path d="M242 118 C280 118 285 178 318 182"/>
    <path d="M242 188 H318"/>
    <path d="M242 258 C280 258 285 198 318 194"/>
  </g>

  <!-- system card -->
  <rect x="322" y="110" width="170" height="160" rx="14" fill="#111827"/>
  <text x="407" y="138" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">木日 Kibi 設計系統</text>
  <g>
    <circle cx="350" cy="166" r="10" fill="#7C4A2D"/><circle cx="374" cy="166" r="10" fill="#C9A27E"/><circle cx="398" cy="166" r="10" fill="#FAF8F5"/><circle cx="422" cy="166" r="10" fill="#2B1D14" stroke="#4B5563"/>
  </g>
  <text x="340" y="200" font-size="18" font-weight="700" fill="#FAF8F5">Aa</text>
  <text x="372" y="198" font-size="11" fill="#9CA3AF">標題／內文字型</text>
  <rect x="340" y="214" width="64" height="22" rx="11" fill="#7C4A2D"/>
  <text x="372" y="229" font-size="10" fill="#FFFFFF" text-anchor="middle">立即訂位</text>
  <rect x="412" y="214" width="62" height="22" rx="6" fill="none" stroke="#C9A27E"/>
  <text x="340" y="258" font-size="10" fill="#9CA3AF">顏色、字型、元件、語氣</text>
  <path d="M494 190 H536" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#m)"/>

  <!-- use -->
  <g font-size="12">
    <text x="540" y="76" font-weight="700" fill="#6B7280">開始新設計時</text>
    <rect x="540" y="88" width="220" height="100" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
    <text x="556" y="112" fill="#374151">設計系統選單</text>
    <rect x="556" y="122" width="188" height="26" rx="6" fill="#FFF7ED" stroke="#D97757"/>
    <text x="566" y="140" fill="#111827">✓ 木日 Kibi 設計系統</text>
    <rect x="556" y="154" width="188" height="24" rx="6" fill="#F9FAFB"/>
    <text x="566" y="171" fill="#6B7280">其他品牌…</text>
    <rect x="540" y="200" width="220" height="88" rx="10" fill="#DCFCE7"/>
    <text x="556" y="224" font-size="13" font-weight="700" fill="#047857">結果</text>
    <text x="556" y="246" fill="#374151">網頁、海報、簡報</text>
    <text x="556" y="266" fill="#374151">都自動符合品牌</text>
  </g>

  <text x="40" y="326" font-size="13" fill="#374151">設計系統需要付費方案（beta）。免費版可以改用 DESIGN.md：每次開始設計時附上同一份檔案。</text>
</svg>
