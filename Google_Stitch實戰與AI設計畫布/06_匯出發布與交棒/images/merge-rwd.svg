<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">桌機版＋手機版＋DESIGN.md → 合併成一個真正的 RWD 網頁</text>

  <!-- inputs -->
  <g font-size="12">
    <rect x="40" y="70" width="170" height="70" rx="10" fill="#EFF6FF"/>
    <text x="56" y="96" font-weight="700" fill="#111827">首頁 - 桌機</text>
    <text x="56" y="116" fill="#6B7280" font-family="Menlo,monospace" font-size="11">desktop.html</text>
    <rect x="40" y="152" width="170" height="70" rx="10" fill="#EFF6FF"/>
    <text x="56" y="178" font-weight="700" fill="#111827">首頁 - 手機</text>
    <text x="56" y="198" fill="#6B7280" font-family="Menlo,monospace" font-size="11">mobile.html</text>
    <rect x="40" y="234" width="170" height="70" rx="10" fill="#FEF3C7"/>
    <text x="56" y="260" font-weight="700" fill="#111827">設計規範</text>
    <text x="56" y="280" fill="#6B7280" font-family="Menlo,monospace" font-size="11">DESIGN.md</text>
  </g>
  <g stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#m)">
    <path d="M212 105 C250 105 260 170 296 182"/>
    <path d="M212 187 H296"/>
    <path d="M212 269 C250 269 260 204 296 192"/>
  </g>

  <rect x="300" y="142" width="150" height="90" rx="12" fill="#111827"/>
  <text x="375" y="180" font-size="14" font-weight="700" fill="#FFFFFF" text-anchor="middle">寫程式的 AI</text>
  <text x="375" y="202" font-size="11" fill="#9CA3AF" text-anchor="middle">合併、改成響應式</text>
  <path d="M452 187 H496" stroke="#6B7280" stroke-width="2" fill="none" marker-end="url(#m)"/>

  <!-- output -->
  <rect x="500" y="70" width="260" height="234" rx="12" fill="#DCFCE7"/>
  <text x="516" y="96" font-size="13" font-weight="700" fill="#047857">一個 index.html</text>
  <rect x="516" y="108" width="150" height="100" rx="6" fill="#FFFFFF" stroke="#10B981"/>
  <g fill="#E5E7EB"><rect x="524" y="116" width="134" height="8" rx="2"/><rect x="524" y="130" width="134" height="30" rx="3"/><rect x="524" y="166" width="40" height="34" rx="3"/><rect x="571" y="166" width="40" height="34" rx="3"/><rect x="618" y="166" width="40" height="34" rx="3"/></g>
  <rect x="684" y="108" width="60" height="100" rx="8" fill="#FFFFFF" stroke="#10B981"/>
  <g fill="#E5E7EB"><rect x="690" y="116" width="48" height="8" rx="2"/><rect x="690" y="130" width="48" height="24" rx="3"/><rect x="690" y="160" width="48" height="18" rx="3"/><rect x="690" y="182" width="48" height="18" rx="3"/></g>
  <g font-size="12" fill="#374151">
    <text x="516" y="234">✔ 同一份 HTML，任何寬度都能用</text>
    <text x="516" y="256">✔ @media 斷點切換版面</text>
    <text x="516" y="278">✔ 顏色字型來自 DESIGN.md</text>
  </g>
  <text x="40" y="326" font-size="12" fill="#6B7280">Stitch 匯出的是「各裝置分開」的畫面程式碼，直接上線會變成兩個網站。要真正的 RWD，需要這一步合併。</text>
</svg>
