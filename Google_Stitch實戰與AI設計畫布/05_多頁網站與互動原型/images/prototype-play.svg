<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 340" width="800" height="340" font-family="'PingFang TC','Noto Sans TC','Microsoft JhengHei',sans-serif">
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#6B7280"/>
    </marker>
  </defs>
  <rect width="800" height="340" rx="16" fill="#FFFFFF" stroke="#E5E7EB"/>
  <text x="40" y="42" font-size="18" font-weight="700" fill="#111827">原型：把畫面串起來，按 Play 像真的網站一樣點</text>

  <!-- step 1 connect -->
  <text x="40" y="80" font-size="14" font-weight="700" fill="#1D4ED8">① 串連</text>
  <rect x="40" y="94" width="130" height="170" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="50" y="104" width="110" height="60" rx="4" fill="#BBF7D0"/>
  <rect x="64" y="176" width="82" height="22" rx="11" fill="#2F6B4F" stroke="#2563EB" stroke-width="3"/>
  <text x="105" y="191" font-size="10" fill="#FFFFFF" text-anchor="middle">立即預約</text>
  <rect x="210" y="94" width="110" height="170" rx="10" fill="#FFFFFF" stroke="#2563EB" stroke-width="2"/>
  <g fill="#FFFFFF" stroke="#D1D5DB"><rect x="220" y="116" width="90" height="18" rx="3"/><rect x="220" y="142" width="90" height="18" rx="3"/><rect x="220" y="168" width="90" height="18" rx="3"/></g>
  <rect x="220" y="230" width="90" height="20" rx="10" fill="#2F6B4F"/>
  <path d="M148 187 C180 187 180 150 206 150" fill="none" stroke="#2563EB" stroke-width="2" marker-end="url(#m)"/>
  <text x="40" y="286" font-size="12" fill="#374151">這顆按鈕 → 連到預約表單</text>

  <!-- step 2 auto next -->
  <text x="360" y="80" font-size="14" font-weight="700" fill="#047857">② 自動產生下一頁</text>
  <rect x="360" y="94" width="110" height="170" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
  <rect x="370" y="230" width="90" height="20" rx="10" fill="#2F6B4F" stroke="#10B981" stroke-width="3"/>
  <g fill="#FFFFFF" stroke="#D1D5DB"><rect x="370" y="116" width="90" height="18" rx="3"/><rect x="370" y="142" width="90" height="18" rx="3"/></g>
  <rect x="500" y="94" width="110" height="170" rx="10" fill="#F0FDF4" stroke="#10B981" stroke-dasharray="6 4"/>
  <text x="555" y="174" font-size="22" text-anchor="middle">✨</text>
  <text x="555" y="200" font-size="11" fill="#047857" text-anchor="middle">「預約完成」</text>
  <text x="555" y="216" font-size="11" fill="#047857" text-anchor="middle">AI 推測並產生</text>
  <path d="M462 240 C484 240 480 180 496 180" fill="none" stroke="#10B981" stroke-width="2" marker-end="url(#m)"/>
  <text x="360" y="286" font-size="12" fill="#374151">點一個還沒有目的地的按鈕，</text>
  <text x="360" y="304" font-size="12" fill="#374151">Stitch 可以幫你產生合理的下一頁</text>

  <!-- step 3 play -->
  <text x="650" y="80" font-size="14" font-weight="700" fill="#B45309">③ Play</text>
  <rect x="650" y="94" width="110" height="170" rx="16" fill="#111827"/>
  <rect x="658" y="104" width="94" height="150" rx="8" fill="#FFFFFF"/>
  <rect x="664" y="110" width="82" height="40" rx="4" fill="#BBF7D0"/>
  <circle cx="705" cy="200" r="22" fill="#F59E0B" fill-opacity="0.9"/>
  <path d="M698 189 L714 200 L698 211 Z" fill="#FFFFFF"/>
  <text x="650" y="286" font-size="12" fill="#374151">像使用者一樣</text>
  <text x="650" y="304" font-size="12" fill="#374151">從頭點到尾</text>
</svg>
