      <rect x="348" y="70" width="112" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
      <rect x="356" y="78" width="96" height="50" rx="4" fill="#BBF7D0"/>
      <g fill="#E5E7EB"><rect x="356" y="134" width="70" height="8" rx="2"/><rect x="356" y="148" width="96" height="6" rx="2"/><rect x="356" y="160" width="96" height="6" rx="2"/><rect x="356" y="172" width="80" height="6" rx="2"/></g>
