      <rect x="510" y="78" width="96" height="30" rx="4" fill="#F3F4F6"/>
      <g fill="#FFFFFF" stroke="#D1D5DB"><rect x="510" y="116" width="96" height="16" rx="3"/><rect x="510" y="138" width="96" height="16" rx="3"/><rect x="510" y="160" width="96" height="16" rx="3"/></g>
