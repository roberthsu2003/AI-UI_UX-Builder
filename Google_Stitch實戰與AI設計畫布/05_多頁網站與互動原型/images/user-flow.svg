      <g fill="#E5E7EB"><rect x="48" y="148" width="29" height="40" rx="3"/><rect x="81" y="148" width="29" height="40" rx="3"/><rect x="114" y="148" width="29" height="40" rx="3"/></g>
      <text x="96" y="240" font-weight="700" fill="#111827">① 首頁</text>
    </g>
    <g>
      <rect x="194" y="70" width="112" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
