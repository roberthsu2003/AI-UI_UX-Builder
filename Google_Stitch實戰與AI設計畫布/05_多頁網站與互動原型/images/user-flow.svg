      <rect x="656" y="70" width="104" height="150" rx="10" fill="#FFFFFF" stroke="#D1D5DB"/>
      <circle cx="708" cy="122" r="22" fill="#DCFCE7"/>
      <path d="M697 122 l8 8 l14 -16" fill="none" stroke="#2F6B4F" stroke-width="3"/>
