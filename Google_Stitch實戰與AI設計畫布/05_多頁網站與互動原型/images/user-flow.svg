      <rect x="202" y="94" width="96" height="12" rx="3" fill="#F3F4F6"/>
      <g fill="#E5E7EB"><rect x="202" y="112" width="29" height="36" rx="3"/><rect x="235" y="112" width="29" height="36" rx="3"/><rect x="268" y="112" width="29" height="36" rx="3"/><rect x="202" y="154" width="29" height="36" rx="3"/><rect x="235" y="154" width="29" height="36" rx="3"/><rect x="268" y="154" width="29" height="36" rx="3"/></g>
      <text x="250" y="240" font-weight="700" fill="#111827">② 路線列表</text>
